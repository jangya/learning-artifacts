<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Transformer, Visualized</title>
<style>/* ============================================================
   The Transformer, Visualized — cinematic edition
   ============================================================ */
:root{
  --bg:#080a10;
  --bg2:#0c0f18;
  --panel:#111725;
  --panel2:#0d1220;
  --ink:#eaf0fb;
  --muted:#93a0b8;
  --faint:#5b6883;
  --line:rgba(150,170,210,.12);
  --line2:rgba(150,170,210,.22);
  --blue:#5ea0ff;      /* primary accent */
  --blue-2:#3b74d6;
  --cyan:#54d6e6;
  --amber:#ffcf6b;     /* Query / highlight */
  --orange:#ff9f57;    /* positive values */
  --teal:#43e0c0;      /* head 1 */
  --green:#68e6a0;     /* Value / answers */
  --pink:#ff77c8;      /* Key / attention heat */
  --violet:#b98cff;    /* head 0 */
  --pos:#ff9f57;       /* diverging + */
  --neg:#5aa0ff;       /* diverging - */
  --shadow:0 18px 50px -20px rgba(0,0,0,.8);
  --glow-blue:0 0 18px rgba(94,160,255,.45);
  --glow-amber:0 0 18px rgba(255,207,107,.4);
  --glow-green:0 0 18px rgba(104,230,160,.4);
  --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono","Menlo",monospace;
  --serif:"Iowan Old Style","Palatino Linotype","Cambria",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 700px at 78% -8%, rgba(94,160,255,.10), transparent 60%),
    radial-gradient(1000px 620px at 0% 108%, rgba(185,140,255,.08), transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.wrap{max-width:1280px;margin:0 auto;padding:0 22px 90px}

/* ---------- Header ---------- */
header.top{
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(14px);
  background:linear-gradient(180deg,rgba(8,10,16,.96),rgba(8,10,16,.72));
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1280px;margin:0 auto;padding:10px 22px 6px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:11px;margin-right:auto}
.brand .logo{
  font-family:var(--serif);font-style:italic;font-weight:600;font-size:21px;
  background:linear-gradient(92deg,var(--blue),var(--cyan) 55%,var(--teal));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  letter-spacing:.2px;
}
.brand .sub{color:var(--faint);font-size:12.5px;letter-spacing:.3px}
.vbadge{font-family:var(--mono);font-size:10.5px;color:var(--teal);border:1px solid rgba(67,224,192,.3);
  border-radius:8px;padding:3px 8px;background:rgba(67,224,192,.06);cursor:default;white-space:nowrap}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{
  border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;
  padding:6px 12px;border-radius:8px;cursor:pointer;transition:.18s;white-space:nowrap;
}
.seg button.on{background:linear-gradient(180deg,rgba(94,160,255,.25),rgba(94,160,255,.12));color:var(--ink);box-shadow:inset 0 0 0 1px rgba(94,160,255,.4)}
.seg button:hover:not(.on){color:var(--ink)}
.seg.mini button{padding:4px 9px;font-size:12px}

/* ---------- Live pipeline map (in header) ---------- */
.maprow{max-width:1280px;margin:0 auto;padding:2px 22px 10px;display:flex;align-items:center;gap:0;position:relative}
@media(max-width:820px){.maprow{display:none}}
.mapnode{
  border:1px solid var(--line2);background:var(--panel2);color:var(--muted);
  font:inherit;font-size:11.5px;padding:5px 10px;border-radius:9px;cursor:pointer;
  transition:.2s;white-space:nowrap;position:relative;z-index:2;
}
.mapnode:hover{color:var(--ink);border-color:var(--blue)}
.mapnode.on{color:var(--ink);border-color:var(--blue);background:linear-gradient(180deg,rgba(94,160,255,.28),rgba(94,160,255,.10));box-shadow:var(--glow-blue)}
.mapnode.done{border-color:rgba(67,224,192,.45);color:var(--teal)}
.mapnode .mi{margin-right:5px;opacity:.8}
.maplink{flex:1;height:2px;background:var(--line2);min-width:8px;position:relative;z-index:1}
.maplink.done{background:linear-gradient(90deg,rgba(67,224,192,.6),rgba(67,224,192,.35))}
.mapdot{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--amber);
  box-shadow:0 0 14px rgba(255,207,107,.8);top:50%;margin-top:-5.5px;left:0;opacity:0;pointer-events:none;z-index:3}
.maplab{position:absolute;font-family:var(--mono);font-size:9px;color:var(--faint);top:-11px;left:50%;transform:translateX(-50%);white-space:nowrap}

/* ---------- Input strip ---------- */
.inputbar{
  margin-top:20px;padding:16px 18px;border-radius:16px;
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.inputbar .lab{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--faint);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{
  --c:var(--blue);
  position:relative;display:inline-flex;align-items:center;gap:8px;
  padding:8px 12px;border-radius:11px;cursor:pointer;user-select:none;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  border:1px solid var(--line2);color:var(--ink);font-size:14.5px;
  transition:.16s transform,.16s box-shadow,.16s border-color;
}
.chip .pos{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.chip:hover{transform:translateY(-1px);border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 8px 20px -10px var(--c)}
.chip.sp{opacity:.7;font-style:italic}
.chip .x{opacity:0;margin-left:-2px;color:var(--faint);font-size:12px;transition:.15s}
.chip:hover .x{opacity:1}
.addwrap{position:relative}
.add{
  border:1px dashed var(--line2);background:transparent;color:var(--muted);
  border-radius:11px;padding:8px 12px;cursor:pointer;font:inherit;font-size:14px;transition:.16s;
}
.add:hover{color:var(--ink);border-color:var(--blue)}
.vocabpop{
  position:absolute;top:calc(100% + 8px);left:0;z-index:40;width:280px;
  background:var(--panel);border:1px solid var(--line2);border-radius:13px;padding:10px;
  box-shadow:var(--shadow);display:none;grid-template-columns:repeat(3,1fr);gap:6px;
}
.vocabpop.open{display:grid}
.vocabpop button{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;padding:7px 4px;font:inherit;font-size:13px;cursor:pointer;transition:.14s}
.vocabpop button:hover{border-color:var(--blue);color:var(--blue)}
.controls-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:14px}
.pick{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.pick select{
  background:var(--panel2);color:var(--ink);border:1px solid var(--line2);border-radius:9px;
  padding:7px 10px;font:inherit;font-size:13px;cursor:pointer;
}
.hint{color:var(--faint);font-size:12.5px;margin-left:auto}

/* ---------- Layout ---------- */
.grid{display:grid;grid-template-columns:232px 1fr;gap:26px;margin-top:26px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}

/* ---------- Rail ---------- */
.rail{position:sticky;top:118px;max-height:calc(100vh - 130px);overflow-y:auto;scrollbar-width:thin}
@media(max-width:900px){.rail{position:static;max-height:none}}
.rail .grp{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--faint);margin:16px 8px 8px}
.rail .grp:first-child{margin-top:0}
.rail a{
  display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:9px;cursor:pointer;
  color:var(--muted);text-decoration:none;font-size:13.5px;position:relative;transition:.16s;
}
.rail a .dot{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none;transition:.16s;box-shadow:none}
.rail a:hover{color:var(--ink);background:rgba(255,255,255,.03)}
.rail a.on{color:var(--ink);background:linear-gradient(90deg,rgba(94,160,255,.14),transparent)}
.rail a.on .dot{background:var(--blue);box-shadow:var(--glow-blue)}
.rail a.done .dot{background:var(--teal)}

/* ---------- Stage ---------- */
.stagewrap{min-height:60vh;position:relative}
.stage{animation:fadein .5s cubic-bezier(.2,.7,.2,1)}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--blue);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.eyebrow .n{font-family:var(--mono);color:var(--faint);font-weight:400}
h1.st{font-family:var(--serif);font-weight:600;font-size:30px;margin:10px 0 6px;letter-spacing:.2px}
.lede{color:var(--muted);font-size:16px;max-width:72ch;margin:0 0 8px}
.panel{
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:18px;
  box-shadow:var(--shadow);
}
.phead{display:flex;align-items:flex-start;gap:12px}
.phead .pht{flex:1}
.panel h3{margin:0 0 4px;font-size:14px;letter-spacing:.02em;color:var(--ink)}
.panel .cap{color:var(--faint);font-size:12.5px;margin:0 0 14px}
.replay{
  border:1px solid var(--line2);background:var(--panel2);color:var(--muted);flex:none;
  border-radius:8px;padding:4px 11px;font:inherit;font-size:12px;cursor:pointer;transition:.15s;
}
.replay:hover{color:var(--amber);border-color:var(--amber)}
.callout{
  border-left:3px solid var(--amber);background:linear-gradient(90deg,rgba(255,207,107,.10),transparent 80%);
  padding:12px 16px;border-radius:0 12px 12px 0;margin-top:16px;color:#f4ecd8;font-size:14.5px;
}
.callout b{color:var(--amber)}
.callout.blue{border-color:var(--blue);background:linear-gradient(90deg,rgba(94,160,255,.12),transparent 80%);color:#dfe9fb}
.callout.blue b{color:var(--blue)}
.callout.green{border-color:var(--green);background:linear-gradient(90deg,rgba(104,230,160,.12),transparent 80%);color:#dbf6e7}
.callout.green b{color:var(--green)}
.callout.violet{border-color:var(--violet);background:linear-gradient(90deg,rgba(185,140,255,.12),transparent 80%);color:#ece2fb}
.callout.violet b{color:var(--violet)}
.intuition-off .callout.intu{display:none}

/* ---------- equations + math walkthroughs ---------- */
.eq{font-family:var(--serif);font-size:19px;color:var(--ink);display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 2px}
.eq .op{color:var(--faint);font-style:normal}
.eq i{color:var(--cyan);font-style:italic}
.eq .sc{font-size:.7em;vertical-align:sub;color:var(--muted)}
.eq .sup{font-size:.7em;vertical-align:super;color:var(--muted)}
.eqnote{color:var(--faint);font-size:12.5px;font-family:var(--sans)}
.math-off .mathonly{display:none}
.eqx{font-family:var(--serif);font-size:18.5px;line-height:2.1;color:var(--ink);margin:4px 0}
.eqx .ln{display:block;opacity:0;transform:translateY(7px);transition:opacity .45s,transform .45s}
.eqx .ln.in{opacity:1;transform:none}
.eqx .t{opacity:.13;transition:opacity .35s;display:inline-block}
.eqx .t.in{opacity:1}
.eqx .res{color:var(--amber);font-weight:600}
.eqx .resg{color:var(--green);font-weight:600}
.eqx .mono{font-family:var(--mono);font-size:.78em}
.cQ{color:var(--amber)}.cK{color:var(--pink)}.cV{color:var(--green)}
.cH0{color:var(--violet)}.cH1{color:var(--teal)}.cX{color:var(--cyan)}
.walkbtn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,207,107,.4);
  background:rgba(255,207,107,.08);color:var(--amber);border-radius:9px;padding:6px 13px;
  font:inherit;font-size:12.5px;cursor:pointer;transition:.16s;margin:6px 0 2px;
}
.walkbtn:hover{box-shadow:var(--glow-amber)}
.walkbtn:disabled{opacity:.4;cursor:default;box-shadow:none}

/* ---------- Matrix / vector rendering ---------- */
.matrix{display:inline-grid;gap:3px;padding:4px;border-radius:10px}
.cell{
  width:var(--cw,34px);height:var(--ch,28px);border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.92);position:relative;cursor:default;
  border:1px solid rgba(255,255,255,.06);
  transition:transform .12s,box-shadow .12s,outline-color .12s,opacity .4s;
}
.cell:hover{transform:scale(1.14);z-index:5;box-shadow:0 6px 18px -6px #000;outline:1px solid var(--ink)}
.cell.hl{outline:2px solid var(--amber);box-shadow:var(--glow-amber);z-index:4}
.cell.hlb{outline:2px solid var(--blue);box-shadow:var(--glow-blue);z-index:4}
.cell.dim{opacity:.28}
.cell.pre{opacity:0;transform:scale(.5)}
.cell.masked{background:repeating-linear-gradient(45deg,#141a26,#141a26 5px,#0e131d 5px,#0e131d 10px) !important;color:var(--faint)}
@keyframes cellflash{0%{outline:2.5px solid var(--amber);box-shadow:var(--glow-amber)}85%{outline:2.5px solid var(--amber);box-shadow:var(--glow-amber)}100%{outline:2.5px solid transparent;box-shadow:none}}
.cell.flash{animation:cellflash 1s ease-out;z-index:6}
@keyframes cellflashb{0%{outline:2.5px solid var(--blue);box-shadow:var(--glow-blue)}85%{outline:2.5px solid var(--blue);box-shadow:var(--glow-blue)}100%{outline:2.5px solid transparent;box-shadow:none}}
.cell.flashb{animation:cellflashb 1s ease-out;z-index:6}
@keyframes cellflashg{0%{outline:2.5px solid var(--green);box-shadow:var(--glow-green)}85%{outline:2.5px solid var(--green);box-shadow:var(--glow-green)}100%{outline:2.5px solid transparent;box-shadow:none}}
.cell.flashg{animation:cellflashg 1s ease-out;z-index:6}
.labels-x,.labels-y{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.mtx-block{display:inline-flex;flex-direction:column;gap:5px;vertical-align:top}
.mtx-tag{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--muted)}
.mtx-tag b{color:var(--ink);font-style:normal;font-family:var(--mono);font-size:11px;background:var(--panel2);padding:1px 6px;border-radius:5px;border:1px solid var(--line);margin-left:6px}
.vecrow{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.tokvec{display:flex;flex-direction:column;align-items:center;gap:6px}
.tokvec .tk{font-size:12.5px;color:var(--muted);font-family:var(--sans)}
.tokvec .tk .p{font-family:var(--mono);font-size:10px;color:var(--faint)}
.flowrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.arrow{color:var(--faint);font-size:22px;line-height:1}
.opbadge{font-family:var(--mono);font-size:11.5px;color:var(--blue);border:1px solid rgba(94,160,255,.35);background:rgba(94,160,255,.08);padding:4px 9px;border-radius:8px}
.scrollx{overflow-x:auto;padding-bottom:6px}
.scrollx::-webkit-scrollbar{height:8px}
.scrollx::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}

/* ---------- bars ---------- */
.bars{display:flex;flex-direction:column;gap:5px;font-family:var(--mono);font-size:12px}
.barrow{display:grid;grid-template-columns:66px 1fr 56px;align-items:center;gap:10px}
.barrow .bt{text-align:right;color:var(--muted)}
.bartrack{height:16px;background:var(--panel2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.barfill{height:100%;border-radius:6px 0 0 6px;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .55s cubic-bezier(.2,.7,.2,1)}
.barrow.top .barfill{background:linear-gradient(90deg,var(--green),var(--teal))}
.barrow.top .bt{color:var(--green)}
.barval{color:var(--faint);text-align:left;white-space:nowrap}

/* ---------- attention arcs ---------- */
.arcbox{position:relative}
.arcsvg{display:block;width:100%;overflow:visible}
.arcsvg path.arc{fill:none;stroke-linecap:round;transition:opacity .3s}
.arclabel{font-family:var(--mono);font-size:10px;fill:#c9d4ea;paint-order:stroke;stroke:#080a10;stroke-width:3px}
.arctoks{display:flex;gap:9px;flex-wrap:nowrap;justify-content:center;padding:4px 4px 2px;overflow:visible}
.arctok{
  border:1px solid var(--line2);background:var(--panel2);border-radius:10px;
  padding:6px 11px 5px;cursor:pointer;font-family:var(--serif);font-size:15.5px;color:var(--ink);
  transition:.18s;text-align:center;line-height:1.25;position:relative;
}
.arctok:hover{transform:translateY(-2px);border-color:var(--line2)}
.arctok.q{border-color:var(--amber);box-shadow:var(--glow-amber)}
.arctok.q .aw{color:var(--amber)}
.arctok.dim{opacity:.38}
.arctok.fut{opacity:.22}
.arctok .aw{display:block;font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:2px;min-height:12px;transition:.2s}
.arclegend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-top:10px}
.arclegend .sw{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px;border-radius:2px}
.arclegend .sw.dash{border-top-style:dashed}
.flowdot{pointer-events:none}

/* ---------- geometric plot ---------- */
.geo{background:radial-gradient(500px 300px at 50% 40%,rgba(94,160,255,.06),transparent 70%),var(--panel2);border:1px solid var(--line);border-radius:14px}
.geolegend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.keydot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* ---------- waves ---------- */
.wavesvg{display:block;width:100%;height:auto}
.wavesvg .wlab{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.wavesvg .wsub{font-family:var(--mono);font-size:9.5px;fill:var(--faint)}

/* ---------- FFN network ---------- */
.ffnsvg{display:block;max-width:100%;height:auto}
.ffnsvg .nl{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.ffnsvg .nv{font-family:var(--mono);font-size:9.5px;fill:#eaf0fb;text-anchor:middle}
@keyframes reluchop{0%{opacity:1}30%{opacity:1;fill:#ff6b6b}100%{opacity:.25;fill:#1a2030}}

/* ---------- tooltip ---------- */
#tip{
  position:fixed;z-index:99;pointer-events:none;opacity:0;transform:translateY(4px);
  background:#0a0e17;border:1px solid var(--line2);border-radius:9px;padding:8px 11px;
  font-family:var(--mono);font-size:11.5px;color:var(--ink);box-shadow:var(--shadow);
  max-width:280px;transition:opacity .12s;white-space:pre-line;line-height:1.45;
}
#tip.on{opacity:1}
#tip b{color:var(--amber)}

/* ---------- nav ---------- */
.nav{display:flex;gap:12px;align-items:center;margin-top:30px}
.btn{
  display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line2);
  background:linear-gradient(180deg,var(--panel),var(--panel2));color:var(--ink);
  border-radius:12px;padding:11px 18px;font:inherit;font-size:14.5px;cursor:pointer;transition:.16s;
}
.btn:hover{border-color:var(--blue);box-shadow:var(--glow-blue);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(180deg,var(--blue),var(--blue-2));border-color:transparent;color:#04101f;font-weight:600}
.btn.primary:hover{box-shadow:0 0 26px rgba(94,160,255,.5)}
.btn.go{background:linear-gradient(180deg,var(--green),#2fae76);border-color:transparent;color:#03140b;font-weight:600}
.btn.go:hover{box-shadow:0 0 26px rgba(104,230,160,.5)}
.btn:disabled{opacity:.35;cursor:default;transform:none;box-shadow:none;border-color:var(--line)}
.nav .prog{margin-left:auto;color:var(--faint);font-family:var(--mono);font-size:12px}

/* ---------- generation playground ---------- */
.gensent{font-family:var(--serif);font-size:23px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;min-height:46px}
.gtok{padding:6px 13px;border:1px solid var(--line2);border-radius:11px;background:var(--panel2);transition:.3s}
.gtok.bos{opacity:.55;font-style:italic;font-size:17px}
.gtok.new{border-color:var(--green);color:var(--green);box-shadow:0 0 16px rgba(104,230,160,.35);animation:popin .55s cubic-bezier(.2,.9,.3,1.4)}
.gtok.eos{border-color:var(--violet);color:var(--violet);font-style:italic}
@keyframes popin{0%{transform:scale(.2);opacity:0}65%{transform:scale(1.12)}100%{transform:scale(1)}}

<script>/* ============================================================
   CORE: model math, verification, animation engine, helpers
   ============================================================ */
const M = MODEL.meta;
const D = M.d_model, H = M.n_heads, DH = M.d_head, DFF = M.d_ff, NL = M.n_layers;
const EPS = M.eps, SCALE = M.emb_scale, VOCAB = M.vocab, NEG = M.neg_inf;
const stoi = {}; VOCAB.forEach((w,i)=>stoi[w]=i);

/* ---------------- linear algebra ---------------- */
const LA = {
  matmul(A,B){
    const n=A.length,k=B.length,m=B[0].length,C=[];
    for(let i=0;i<n;i++){const r=new Array(m).fill(0);for(let t=0;t<k;t++){const a=A[i][t];if(a===0)continue;const bt=B[t];for(let j=0;j<m;j++)r[j]+=a*bt[j];}C.push(r);}
    return C;
  },
  T(A){const n=A.length,m=A[0].length,C=[];for(let j=0;j<m;j++){const r=new Array(n);for(let i=0;i<n;i++)r[i]=A[i][j];C.push(r);}return C;},
  addRows(A,B){return A.map((r,i)=>r.map((v,j)=>v+B[i][j]));},
  addVec(A,b){return A.map(r=>r.map((v,j)=>v+b[j]));},
  relu(A){return A.map(r=>r.map(v=>Math.max(0,v)));},
  dot(a,b){let s=0;for(let i=0;i<a.length;i++)s+=a[i]*b[i];return s;},
  softmaxRow(v){const mx=Math.max(...v);const e=v.map(x=>Math.exp(x-mx));const s=e.reduce((a,b)=>a+b,0);return e.map(x=>x/s);},
  mean(v){return v.reduce((a,b)=>a+b,0)/v.length;},
  variance(v){const m=LA.mean(v);return v.reduce((a,b)=>a+(b-m)*(b-m),0)/v.length;},
  l2(a,b){let s=0;for(let i=0;i<a.length;i++){const d=a[i]-(b?b[i]:0);s+=d*d;}return Math.sqrt(s);},
};
function layernorm(row,g,b){
  const mu=LA.mean(row), va=LA.variance(row), inv=1/Math.sqrt(va+EPS);
  const xhat=row.map(x=>(x-mu)*inv);
  const out=xhat.map((x,i)=>g[i]*x+b[i]);
  return {out,mu,va,inv,xhat};
}

/* ---------------- forward pass with full trace ---------------- */
function forward(tokens){
  const T=tokens.length;
  const E=MODEL.E, PEm=MODEL.PE;
  const tokEmb=tokens.map(id=>E[id].map(v=>v*SCALE));
  const PEused=PEm.slice(0,T).map(r=>r.slice());
  let X=tokEmb.map((r,i)=>r.map((v,j)=>v+PEused[i][j]));
  const X0=X.map(r=>r.slice());
  const layers=[];
  for(let l=0;l<NL;l++){
    const L=MODEL.layers[l];
    const Xin=X.map(r=>r.slice());
    const Q=LA.matmul(X,L.WQ), K=LA.matmul(X,L.WK), Vv=LA.matmul(X,L.WV);
    const heads=[];
    const ctx=X.map(()=>new Array(D).fill(0));
    for(let h=0;h<H;h++){
      const Qh=Q.map(r=>r.slice(h*DH,h*DH+DH));
      const Kh=K.map(r=>r.slice(h*DH,h*DH+DH));
      const Vh=Vv.map(r=>r.slice(h*DH,h*DH+DH));
      const raw=[],masked=[],A=[];
      for(let i=0;i<T;i++){
        const rr=[],mm=[];
        for(let j=0;j<T;j++){const s=LA.dot(Qh[i],Kh[j])/Math.sqrt(DH);rr.push(s);mm.push(j>i?NEG:s);}
        raw.push(rr);masked.push(mm);A.push(LA.softmaxRow(mm));
      }
      const ctxh=A.map(a=>{const o=new Array(DH).fill(0);for(let j=0;j<T;j++)for(let d=0;d<DH;d++)o[d]+=a[j]*Vh[j][d];return o;});
      for(let i=0;i<T;i++)for(let d=0;d<DH;d++)ctx[i][h*DH+d]=ctxh[i][d];
      heads.push({Qh,Kh,Vh,raw,masked,A,ctxh});
    }
    const attnOut=LA.matmul(ctx,L.WO);
    const add1=LA.addRows(Xin,attnOut);
    const ln1=add1.map(r=>layernorm(r,L.g1,L.be1));
    const X1=ln1.map(x=>x.out);
    const h1=LA.addVec(LA.matmul(X1,L.W1),L.b1);
    const a=LA.relu(h1);
    const ffn=LA.addVec(LA.matmul(a,L.W2),L.b2);
    const add2=LA.addRows(X1,ffn);
    const ln2=add2.map(r=>layernorm(r,L.g2,L.be2));
    const X2=ln2.map(x=>x.out);
    X=X2;
    layers.push({Xin,Q,K,Vv,heads,ctx,attnOut,add1,ln1,X1,h1,a,ffn,add2,ln2,X2});
  }
  const Xfinal=X.map(r=>r.slice());
  const logits=LA.matmul(Xfinal,LA.T(MODEL.E));
  return {tokens,words:tokens.map(i=>VOCAB[i]),T,tokEmb,PEused,X0,layers,Xfinal,logits};
}

/* ---------------- self-verification vs bundled reference ---------------- */
function verifyModel(){
  try{
    const ref=MODEL.reference;
    const tr=forward(ref.tokens);
    let dLogit=0, dAttn=0, dX=0;
    const last=tr.logits[tr.T-2]; /* row 7: the “…mat → ⟨eos⟩” prediction the reference stores */
    ref.logits_last.forEach((v,i)=>dLogit=Math.max(dLogit,Math.abs(v-last[i])));
    [[3,'probs_pos3'],[6,'probs_pos6']].forEach(([p,k])=>{
      const pr=LA.softmaxRow(tr.logits[p]);
      ref[k].forEach((v,i)=>dLogit=Math.max(dLogit,Math.abs(v-pr[i])));
    });
    [['L0_A',0],['L1_A',1]].forEach(([k,l])=>{
      ref[k].forEach((headA,h)=>headA.forEach((row,i)=>row.forEach((v,j)=>{
        dAttn=Math.max(dAttn,Math.abs(v-tr.layers[l].heads[h].A[i][j]));})));
    });
    ref.Xfinal.forEach((row,i)=>row.forEach((v,j)=>dX=Math.max(dX,Math.abs(v-tr.Xfinal[i][j]))));
    const ok=dLogit<1e-6&&dAttn<1e-9&&dX<1e-6;
    window.__VERIFY={ok,dLogit,dAttn,dX};
    const b=document.getElementById('vbadge');
    if(b){
      b.textContent=ok?'● live math ✓ verified':'● verification failed';
      b.style.color=ok?'':'#ff6b6b';
      b.title=ok?`Forward pass reproduces the training-time reference exactly.\nmax |Δlogit| = ${dLogit.toExponential(1)}\nmax |Δattention| = ${dAttn.toExponential(1)}`:'Computed values diverge from reference!';
    }
    console.log('[verify]',ok?'OK':'MISMATCH','dLogit',dLogit,'dAttn',dAttn,'dX',dX);
  }catch(e){window.__VERIFY={ok:false,err:String(e)};console.error('[verify]',e);}
}

/* ---------------- color mapping ---------------- */
function maxAbs(mat){let m=1e-9;for(const r of mat)for(const v of r){if(v<=NEG/2)continue;const a=Math.abs(v);if(a>m)m=a;}return m;}
function divColor(v,scale){
  if(v<=NEG/2) return null;
  let t=v/scale; t=Math.max(-1,Math.min(1,t)); const a=Math.pow(Math.abs(t),.72);
  const zero=[13,17,26];
  const pos=[255,159,87], neg=[90,160,255];
  const c=t>=0?pos:neg;
  const rgb=zero.map((z,i)=>Math.round(z+(c[i]-z)*a));
  return {rgb,t};
}
function seqColor(v){
  const t=Math.max(0,Math.min(1,v)); const a=Math.pow(t,.75);
  const zero=[13,17,26], hot=[255,138,196];
  const mid=[255,190,120];
  let c; if(a<.6){c=zero.map((z,i)=>Math.round(z+(mid[i]-z)*(a/.6)));}
  else{c=mid.map((mm,i)=>Math.round(mm+(hot[i]-mm)*((a-.6)/.4)));}
  return {rgb:c,t};
}
function textOn(rgb){const lum=(0.299*rgb[0]+0.587*rgb[1]+0.114*rgb[2]);return lum>150?'rgba(6,10,18,.92)':'rgba(255,255,255,.92)';}
function fmt(v,p=2){if(v<=NEG/2)return '−∞';return (v>=0?'':'−')+Math.abs(v).toFixed(p);}
const POSCOLORS=['#8aa0b8','#5ea0ff','#ffcf6b','#68e6a0','#ff77c8','#b98cff','#54d6e6','#ff9f57','#ff6b6b'];
function tokColor(i){return POSCOLORS[i%POSCOLORS.length];}
const HEADC=['#b98cff','#43e0c0']; /* head 0 violet, head 1 teal — CVD-checked pair */
function disp(w){return w==='<bos>'?'⟨bos⟩':w==='<eos>'?'⟨eos⟩':w;}

/* ---------------- DOM helpers ---------------- */
function el(tag,attrs,html){const e=document.createElement(tag);if(attrs)for(const k in attrs){if(k==='class')e.className=attrs[k];else if(k==='style')e.style.cssText=attrs[k];else e.setAttribute(k,attrs[k]);}if(html!==undefined)e.innerHTML=html;return e;}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild);}
const SVGNS='http://www.w3.org/2000/svg';
function sv(tag,attrs){const e=document.createElementNS(SVGNS,tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}

/* ---------------- tooltip ---------------- */
const tip=document.getElementById('tip');
function showTip(html,x,y){tip.innerHTML=html;tip.classList.add('on');const r=tip.getBoundingClientRect();let nx=x+14,ny=y+14;if(nx+r.width>innerWidth-8)nx=x-r.width-14;if(ny+r.height>innerHeight-8)ny=y-r.height-14;tip.style.left=nx+'px';tip.style.top=ny+'px';}
function hideTip(){tip.classList.remove('on');}

/* ============================================================
   ANIMATION ENGINE
   - MOTION.on: global toggle (header seg; honors prefers-reduced-motion)
   - seq(): a killable timeline; renderStage() kills all previous ones
   - tween/countUp: rAF interpolation
   ============================================================ */
const MOTION={on:!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)};
class Seq{
  constructor(){this.timers=[];this.dead=false;this.t=0;}
  at(ms,fn){if(this.dead)return this;this.timers.push(setTimeout(()=>{if(!this.dead)try{fn();}catch(e){console.error(e);}},MOTION.on?ms:0));return this;}
  step(dur,fn){this.at(this.t,fn);this.t+=MOTION.on?dur:0;return this;}
  wait(ms){this.t+=MOTION.on?ms:0;return this;}
  kill(){this.dead=true;this.timers.forEach(clearTimeout);this.timers=[];}
}
let SEQS=[];
function seq(){const s=new Seq();SEQS.push(s);return s;}
function killSeqs(){SEQS.forEach(s=>s.kill());SEQS=[];}
function tween(dur,fn,ease){
  ease=ease||(t=>1-Math.pow(1-t,3));
  if(!MOTION.on){fn(1);return;}
  const t0=performance.now();
  function f(now){const p=Math.max(0,Math.min(1,(now-t0)/dur));fn(ease(p));if(p<1)requestAnimationFrame(f);}
  requestAnimationFrame(f);
}
function countUp(node,val,dur,dec){dur=dur||600;dec=dec===undefined?2:dec;tween(dur,p=>{node.textContent=fmt(val*p,dec);});}
function flashCells(mtx,coords,cls){
  cls=cls||'flash';
  if(!mtx||!mtx._cells)return;
  coords.forEach(c=>{const cell=(mtx._cells[c[0]]||[])[c[1]];if(!cell)return;
    cell.classList.remove('flash','flashb','flashg');void cell.offsetWidth;cell.classList.add(cls);});
}
function flashVec(vec,idxs,cls){
  cls=cls||'flash';
  if(!vec||!vec._cells)return;
  idxs.forEach(i=>{const cell=vec._cells[i];if(!cell)return;
    cell.classList.remove('flash','flashb','flashg');void cell.offsetWidth;cell.classList.add(cls);});
}
/* sweep-reveal all cells of a matrix built with pre:true */
function sweepIn(mtx,s,per,rowMajor){
  per=per===undefined?10:per;
  if(!mtx||!mtx._cells)return s;
  const list=[];
  mtx._cells.forEach((row,i)=>row.forEach((c,j)=>{if(c)list.push(c);}));
  if(!MOTION.on){list.forEach(c=>c.classList.remove('pre'));return s;}
  list.forEach((c,k)=>s.at(s.t+k*per,()=>c.classList.remove('pre')));
  s.t+=list.length*per+200;
  return s;
}
/* reveal a sequence of .t terms inside an equation line */
function revealTerms(host,s,gap,onTerm){
  const ts=host.querySelectorAll('.t');
  ts.forEach((t,k)=>s.step(gap,()=>{t.classList.add('in');if(onTerm)onTerm(k,t);}));

}
function lineIn(s,node,dur){s.step(dur===undefined?420:dur,()=>node.classList.add('in'));return s;}

<script>/* ============================================================
   COMPONENTS: matrices, vectors, bars, arcs, map, geo, waves, FFN net

/* ---------------- matrix renderer (with cell registry) ----------------
   opts: data, mode 'div'|'seq', scale, cw,ch, xlabels, ylabels, maskUpper,
         hlRows[], hlCols[], dimExcept(i,j), tip(i,j,v), onCell(cell,i,j,v),
         pre (start cells hidden for sweep-in) */
function renderMatrix(opts){
  const {data,mode='div',cw=34,ch=28,xlabels,ylabels,maskUpper=false}=opts;
  const scale=opts.scale||maxAbs(data);
  const n=data.length,m=data[0].length;
  const g=el('div',{class:'matrix'});
  g.style.display='grid';
  g.style.width='max-content';
  g.style.justifyContent='start';
  g.style.gap='3px';
  g.style.gridTemplateColumns=(ylabels?'auto ':'')+`repeat(${m},${cw}px)`;
  g.style.gridTemplateRows=(xlabels?'auto ':'')+`repeat(${n},${ch}px)`;
  if(xlabels){
    if(ylabels)g.appendChild(el('div'));
    xlabels.forEach(lb=>{const c=el('div',{class:'labels-x'},lb);c.style.cssText='display:flex;align-items:flex-end;justify-content:center;white-space:nowrap';g.appendChild(c);});
  }
  const cells=[];
  const usePre=opts.pre&&MOTION.on;
  for(let i=0;i<n;i++){
    cells.push([]);
    if(ylabels){const c=el('div',{class:'labels-y'},ylabels[i]);c.style.cssText='display:flex;align-items:center;justify-content:flex-end;white-space:nowrap;padding-right:2px';g.appendChild(c);}
    for(let j=0;j<m;j++){
      const v=data[i][j];
      const masked=maskUpper&&j>i;
      const cell=el('div',{class:'cell'+(masked?' masked':'')+(usePre?' pre':'')});
      cell.style.width=cw+'px';cell.style.height=ch+'px';
      if(!masked){
        const col=mode==='seq'?seqColor(v):divColor(v,scale);
        if(col){cell.style.background=`rgb(${col.rgb.join(',')})`;cell.style.color=textOn(col.rgb);}
        cell.textContent=(cw>=28)?fmt(v,mode==='seq'?2:1):'';
      }
      if(opts.hlRows&&opts.hlRows.includes(i))cell.classList.add(mode==='seq'?'hl':'hlb');
      if(opts.hlCols&&opts.hlCols.includes(j))cell.classList.add('hl');
      if(opts.dimExcept&&!opts.dimExcept(i,j))cell.classList.add('dim');
      const tipfn=opts.tip;
      cell.addEventListener('mousemove',e=>{showTip(tipfn?tipfn(i,j,v):fmt(v,3),e.clientX,e.clientY);});
      cell.addEventListener('mouseleave',hideTip);
      if(opts.onCell)opts.onCell(cell,i,j,v);
      cells[i].push(cell);
      g.appendChild(cell);
    }
  }
  g._cells=cells;
  return g;
}

/* column-vector renderer */
function renderColVec(vec,opts={}){
  const {scale=maxAbs([vec]),mode='div',cw=40,ch=24,label,tip:tipfn,hl,pre}=opts;
  const box=el('div',{class:'tokvec'});
  const grid=el('div',{class:'matrix'});grid.style.gridTemplateColumns=`${cw}px`;
  const cells=[];
  const usePre=pre&&MOTION.on;
  vec.forEach((v,i)=>{
    const cell=el('div',{class:'cell'+(usePre?' pre':'')});cell.style.width=cw+'px';cell.style.height=ch+'px';
    const col=mode==='seq'?seqColor(v):divColor(v,scale);
    cell.style.background=`rgb(${col.rgb.join(',')})`;cell.style.color=textOn(col.rgb);
    cell.textContent=fmt(v,2);
    if(hl&&hl.includes(i))cell.classList.add('hlb');
    cell.addEventListener('mousemove',e=>showTip(tipfn?tipfn(i,v):`dim ${i}: ${fmt(v,3)}`,e.clientX,e.clientY));
    cell.addEventListener('mouseleave',hideTip);
    cells.push(cell);
    grid.appendChild(cell);
  });
  box.appendChild(grid);
  box._cells=cells;box._grid=grid;
  if(label!==undefined){const t=el('div',{class:'tk'});t.innerHTML=label;box.appendChild(t);}
  return box;
}

/* distribution bars — updatable in place (rows keyed by label, flex order) */
function renderBars(items,opts={}){
  const box=el('div',{class:'bars'});
  box._rows={};box._opts=opts;
  function ensure(it){
    let r=box._rows[it.label];
    if(!r){
      const row=el('div',{class:'barrow'});
      const bt=el('div',{class:'bt'},it.label);
      const track=el('div',{class:'bartrack'});
      const fill=el('div',{class:'barfill'});fill.style.width='0%';
      track.appendChild(fill);
      const val=el('div',{class:'barval'},'');
      row.appendChild(bt);row.appendChild(track);row.appendChild(val);
      box.appendChild(row);
      r=box._rows[it.label]={row,fill,val,bt};
    }
    return r;
  }
  box._update=function(newItems,o2){
    const o=Object.assign({},opts,o2||{});
    const max=o.max||Math.max(...newItems.map(i=>i.val),1e-9);
    const present={};
    newItems.forEach((it,rank)=>{
      present[it.label]=1;
      const r=ensure(it);
      r.row.classList.toggle('top',!!it.top);
      r.row.style.order=rank;
      r.row.style.display='';
      r.fill.style.width=Math.max(o.minPct||0,100*it.val/max)+'%';
      if(it.fillStyle)r.fill.style.background=it.fillStyle;
      r.val.textContent=o.pct?(100*it.val).toFixed(1)+'%':fmt(it.val,o.dec===undefined?2:o.dec);
    });
    for(const k in box._rows)if(!present[k])box._rows[k].row.style.display='none';
  };
  box.style.display='flex';
  box._update(items);
  return box;
}

/* ---------------- attention arc diagram ---------------- */
function renderArcs(opts){
  const st={
    layer:opts.layer!==undefined?opts.layer:NL-1,
    head:opts.head!==undefined?opts.head:'both',
    query:opts.query!==undefined?opts.query:TR.T-1,
    all:!!opts.all,
    minW:opts.minW!==undefined?opts.minW:.02,
  };
  const height=opts.height||180;
  const pct=opts.pct!==false;
  const interactive=opts.interactive!==false;
  const box=el('div',{class:'arcbox'});
  const svg=sv('svg',{class:'arcsvg'});svg.style.height=height+'px';
  const toks=el('div',{class:'arctoks'});
  box.appendChild(svg);box.appendChild(toks);
  const pills=[];
  for(let i=0;i<TR.T;i++){
    const pill=el('button',{class:'arctok'});
    pill.innerHTML=`<span style="color:${tokColor(i)}">${disp(VOCAB[TR.tokens[i]])}</span><span class="aw"></span>`;
    if(interactive){
      pill.addEventListener('mouseenter',()=>draw(i,true,true));
      pill.addEventListener('mouseleave',()=>draw(st.query,false,false));
      pill.addEventListener('click',()=>{st.query=i;draw(i,false,false);if(opts.onPick)opts.onPick(i);});
      pill.addEventListener('mousemove',e=>{
        const rows=headsFor().map(h=>{
          const A=TR.layers[st.layer].heads[h].A;
          const inc=[];for(let q=i;q<TR.T;q++)if(A[q][i]>=.05)inc.push(`${disp(VOCAB[TR.tokens[q]])} ${(100*A[q][i]).toFixed(0)}%`);
          return `h${h} is read by: ${inc.length?inc.join(', '):'—'}`;
        }).join('\n');
        showTip(`<b>${disp(VOCAB[TR.tokens[i]])}</b> (position ${i})\n${rows}\nhover = preview as query · click = set query`,e.clientX,e.clientY);
      });
      pill.addEventListener('mouseleave',hideTip);
    }
    toks.appendChild(pill);pills.push(pill);
  }
  function headsFor(){return st.head==='both'?[0,1]:[parseInt(st.head)];}
  let lastArcs=[];
  function draw(qi,animate,preview){
    if(box.clientWidth===0){requestAnimationFrame(()=>draw(qi,animate,preview));return;}
    clear(svg);
    const W=box.clientWidth;
    svg.setAttribute('viewBox',`0 0 ${W} ${height}`);
    svg.setAttribute('preserveAspectRatio','none');
    const boxR=box.getBoundingClientRect();
    const xs=pills.map(p=>{const r=p.getBoundingClientRect();return r.left+r.width/2-boxR.left;});
    const baseY=height-2;
    const hs=headsFor();
    lastArcs=[];
    const queries=st.all?Array.from({length:TR.T},(_,k)=>k):[qi];
    const gAll=st.all;
    const paths=[];
    queries.forEach(q=>{
      hs.forEach(h=>{
        const A=TR.layers[st.layer].heads[h].A[q];
        for(let j=0;j<=q;j++){
          const w=A[j];if(w<st.minW)continue;
          const x0=xs[j],x1=xs[q];
          let d,cy;
          if(j===q){
            cy=baseY-26;
            d=`M ${x0-10},${baseY} C ${x0-15},${cy} ${x0+15},${cy} ${x0+10},${baseY}`;
          }else{
            const arcH=Math.min(height-16,34+Math.abs(x1-x0)*.33);
            cy=baseY-arcH;
            d=`M ${x0},${baseY} Q ${(x0+x1)/2},${cy} ${x1},${baseY}`;
          }
          const p=sv('path',{class:'arc',d});
          p.setAttribute('stroke',HEADC[h]);
          p.setAttribute('stroke-width',(1+8*w).toFixed(2));
          const op=(gAll?.1+.5*w:.18+.8*w).toFixed(3);
          p.setAttribute('stroke-opacity',op);
          if(h===1&&hs.length>1)p.setAttribute('stroke-dasharray','7 5');
          svg.appendChild(p);
          paths.push({p,h,w});
          lastArcs.push({x0,x1,cy,w,color:HEADC[h],j,q,baseY});
          if(pct&&!gAll&&w>=.07&&j!==q){
            const lx=(x0+x1)/2, ly=.5*baseY+.5*cy-5;
            const t=sv('text',{class:'arclabel',x:lx,y:ly,'text-anchor':'middle'});
            t.textContent=(100*w).toFixed(0)+'%';
            svg.appendChild(t);
          }
        }
      });
    });
    if(animate&&MOTION.on){
      paths.forEach((o,k)=>{
        if(o.p.getAttribute('stroke-dasharray'))return;
        const len=o.p.getTotalLength();
        o.p.setAttribute('stroke-dasharray',len);
        o.p.setAttribute('stroke-dashoffset',len);
        o.p.getBoundingClientRect();
        o.p.style.transition=`stroke-dashoffset .45s ease ${(k*45)}ms`;
        requestAnimationFrame(()=>o.p.setAttribute('stroke-dashoffset',0));
      });
    }
    /* pill states + under-labels */
    pills.forEach((pill,j)=>{
      pill.classList.remove('q','dim','fut');
      const aw=pill.querySelector('.aw');
      if(gAll){aw.textContent='';return;}
      if(j===qi){pill.classList.add('q');aw.textContent='query';return;}
      if(j>qi){pill.classList.add('fut');aw.textContent='';return;}
      if(hs.length===1){
        const w=TR.layers[st.layer].heads[hs[0]].A[qi][j];
        aw.textContent=(100*w).toFixed(0)+'%';
        if(w<st.minW)pill.classList.add('dim');
      }else{
        const w0=TR.layers[st.layer].heads[0].A[qi][j];
        const w1=TR.layers[st.layer].heads[1].A[qi][j];
        aw.innerHTML=`<span style="color:${HEADC[0]}">${(100*w0).toFixed(0)}</span>·<span style="color:${HEADC[1]}">${(100*w1).toFixed(0)}</span>`;
        if(Math.max(w0,w1)<st.minW)pill.classList.add('dim');
      }
    });
  }
  function flow(){
    if(!MOTION.on)return;
    lastArcs.forEach((a,k)=>{
      const c=sv('circle',{class:'flowdot',r:(2.2+6*a.w).toFixed(1),fill:a.color});
      c.setAttribute('opacity',0);
      svg.appendChild(c);
      setTimeout(()=>{
        tween(650,p=>{
          let x,y;
          if(a.j===a.q){x=a.x0;y=a.baseY-(a.baseY-a.cy)*Math.sin(Math.PI*p)*0.8;}
          else{
            const t=p;
            x=(1-t)*(1-t)*a.x0+2*(1-t)*t*(a.x0+a.x1)/2+t*t*a.x1;
            y=(1-t)*(1-t)*a.baseY+2*(1-t)*t*a.cy+t*t*a.baseY;
          }
          c.setAttribute('cx',x);c.setAttribute('cy',y);
          c.setAttribute('opacity',p<.08?p*10:(p>.9?(1-p)*10:1));
          if(p===1)c.remove();
        },t=>t);
      },k*55);
    });
  }
  box._st=st;
  const api={
    el:box,st,
    draw:(a)=>draw(st.query,a===undefined?true:a,false),
    update:(part)=>{Object.assign(st,part);if(st.query>TR.T-1)st.query=TR.T-1;draw(st.query,true,false);},
    flow,
  };
  requestAnimationFrame(()=>draw(st.query,opts.animate!==false,false));
  box._api=api;
  return api;
}

/* ---------------- live pipeline map (header) ---------------- */
const MAPNODES=[

/* ---------------- geometric attention plot (animated) ---------------- */
function renderGeo(layer,head,qi,animate){
  const hd=TR.layers[layer].heads[head];
  const W=470,Hh=360,pad=34,cx=W/2,cy=Hh/2;
  const pts=[]; for(let j=0;j<=qi;j++){pts.push(hd.Kh[j]);} pts.push(hd.Qh[qi]);
  let mx=1e-6; pts.forEach(p=>p.forEach(v=>mx=Math.max(mx,Math.abs(v)))); mx*=1.15;
  const u=(Math.min(W,Hh)/2-pad)/mx;
  const X=x=>cx+x*u, Y=y=>cy-y*u;
  const svg=sv('svg',{viewBox:`0 0 ${W} ${Hh}`,width:W,height:Hh,class:'geo'});svg.style.maxWidth='100%';svg.style.height='auto';
  for(let gx=Math.ceil(-mx);gx<=mx;gx++){svg.appendChild(sv('line',{x1:X(gx),y1:0,x2:X(gx),y2:Hh,stroke:'rgba(150,170,210,.06)','stroke-width':1}));}
  for(let gy=Math.ceil(-mx);gy<=mx;gy++){svg.appendChild(sv('line',{x1:0,y1:Y(gy),x2:W,y2:Y(gy),stroke:'rgba(150,170,210,.06)','stroke-width':1}));}
  svg.appendChild(sv('line',{x1:0,y1:cy,x2:W,y2:cy,stroke:'rgba(150,170,210,.22)','stroke-width':1}));
  svg.appendChild(sv('line',{x1:cx,y1:0,x2:cx,y2:Hh,stroke:'rgba(150,170,210,.22)','stroke-width':1}));
  const q=hd.Qh[qi];const qn=Math.hypot(q[0],q[1])||1;const ux=q[0]/qn,uy=q[1]/qn;
  const axis=sv('line',{x1:X(ux*-mx*1.4),y1:Y(uy*-mx*1.4),x2:X(ux*mx*1.4),y2:Y(uy*mx*1.4),stroke:'rgba(255,207,107,.35)','stroke-width':1.4,'stroke-dasharray':'5 5'});
  svg.appendChild(axis);
  const defs=sv('defs',{});const mk=sv('marker',{id:'ah'+layer+head,markerWidth:9,markerHeight:9,refX:7,refY:3,orient:'auto'});mk.appendChild(sv('path',{d:'M0,0 L7,3 L0,6 Z',fill:'#ffcf6b'}));defs.appendChild(mk);svg.appendChild(defs);
  const qline=sv('line',{x1:X(0),y1:Y(0),x2:X(q[0]),y2:Y(q[1]),stroke:'#ffcf6b','stroke-width':2.6,'marker-end':`url(#ah${layer}${head})`});
  svg.appendChild(qline);
  const A=hd.A[qi];
  const anim=animate&&MOTION.on;
  const s=anim?seq():null;
  if(anim){
    const len=Math.hypot(X(q[0])-X(0),Y(q[1])-Y(0));
    qline.setAttribute('stroke-dasharray',len);qline.setAttribute('stroke-dashoffset',len);
    qline.getBoundingClientRect();

  for(let j=0;j<=qi;j++){

    c.addEventListener('mouseleave',hideTip);

    if(anim){

  return svg;
