/* ---------------- sinusoidal wave view ---------------- */
function renderWaves(){
  const T=TR.T;
  const W=680,rowH=54,padL=54,padR=110,plotW=W-padL-padR;
  const Hh=rowH*D+26;
  const svg=sv('svg',{viewBox:`0 0 ${W} ${Hh}`,class:'wavesvg'});
  const dimC=['#5ea0ff','#54d6e6','#b98cff','#43e0c0'];
  const names=['sin(pos)','cos(pos)','sin(pos∕100)','cos(pos∕100)'];
  const maxPos=M.maxlen-1;
  const xOf=p=>padL+plotW*p/maxPos;
  for(let d=0;d<D;d++){
    const cy=rowH*d+rowH/2+6;
    const amp=rowH*.36;
    svg.appendChild(sv('line',{x1:padL,y1:cy,x2:padL+plotW,y2:cy,stroke:'rgba(150,170,210,.14)','stroke-width':1}));
    const i2=Math.floor(d/2)*2;
    const freq=1/Math.pow(10000,i2/D);
    const isSin=d%2===0;
    let path='';
    for(let k=0;k<=120;k++){
      const p=maxPos*k/120;
      const v=isSin?Math.sin(p*freq):Math.cos(p*freq);
      path+=(k?'L':'M')+xOf(p).toFixed(1)+','+(cy-amp*v).toFixed(1)+' ';
    }
    const pth=sv('path',{d:path,fill:'none',stroke:dimC[d],'stroke-width':2,'stroke-opacity':.85});
    svg.appendChild(pth);
    if(MOTION.on){
      const len=pth.getTotalLength();
      pth.setAttribute('stroke-dasharray',len);pth.setAttribute('stroke-dashoffset',len);
      pth.getBoundingClientRect();
      pth.style.transition=`stroke-dashoffset 1.1s ease ${d*.18}s`;
      requestAnimationFrame(()=>pth.setAttribute('stroke-dashoffset',0));
    }
    const lab=sv('text',{class:'wlab',x:W-padR+8,y:cy-4});lab.textContent='d'+d;
    const sub=sv('text',{class:'wsub',x:W-padR+8,y:cy+10});sub.textContent=names[d];
    lab.setAttribute('fill',dimC[d]);
    svg.appendChild(lab);svg.appendChild(sub);
    for(let p=0;p<T;p++){
      const v=TR.PEused[p][d];
      const c=sv('circle',{cx:xOf(p),cy:cy-amp*v,r:MOTION.on?0:4.5,fill:'#eaf0fb',stroke:dimC[d],'stroke-width':2});
      c.addEventListener('mousemove',e=>showTip(`<b>position ${p}</b> · d${d}\nPE = ${names[d].replace('pos',p)} = ${fmt(v,3)}`,e.clientX,e.clientY));
      c.addEventListener('mouseleave',hideTip);
      svg.appendChild(c);
      if(MOTION.on){const s=seq();s.at(1100+p*90,()=>tween(240,q=>c.setAttribute('r',(4.5*q).toFixed(2))));}
    }
  }
  for(let p=0;p<=maxPos;p++){
    const t=sv('text',{class:'wsub',x:xOf(p),y:Hh-4,'text-anchor':'middle'});
    t.textContent=p;
    if(p<T)t.setAttribute('fill',tokColor(p));
    svg.appendChild(t);
  }
  return svg;
}

/* ---------------- FFN firing network ---------------- */
function renderFFNNet(l,i,animate){
  const Lw=MODEL.layers[l];
  const x=TR.layers[l].X1[i], pre=TR.layers[l].h1[i], act=TR.layers[l].a[i], out=TR.layers[l].ffn[i];
  const W=640,Hh=330;
  const svg=sv('svg',{viewBox:`0 0 ${W} ${Hh}`,class:'ffnsvg'});
  svg.style.width=W+'px';
  const xIn=80,xHid=320,xOut=560;
  const yIn=d=>60+d*(210/(D-1));
  const yHid=k=>34+k*(262/(DFF-1));
  const anim=animate&&MOTION.on;
  const s=anim?seq():null;
  let mx1=1e-9;for(let d=0;d<D;d++)for(let k=0;k<DFF;k++)mx1=Math.max(mx1,Math.abs(Lw.W1[d][k]*x[d]));
  let mx2=1e-9;for(let k=0;k<DFF;k++)for(let d=0;d<D;d++)mx2=Math.max(mx2,Math.abs(Lw.W2[k][d]*act[k]));
  const e1=[],e2=[];
  for(let d=0;d<D;d++)for(let k=0;k<DFF;k++){
    const prod=Lw.W1[d][k]*x[d];
    const ln=sv('line',{x1:xIn,y1:yIn(d),x2:xHid,y2:yHid(k),
      stroke:prod>=0?'#ff9f57':'#5aa0ff','stroke-width':Math.max(.4,2.6*Math.abs(prod)/mx1).toFixed(2),
      'stroke-opacity':anim?0:.4});
    ln.addEventListener('mousemove',e=>showTip(`W₁[${d}][${k}] × x[${d}]\n= ${fmt(Lw.W1[d][k],2)} × ${fmt(x[d],2)} = <b>${fmt(prod,2)}</b>`,e.clientX,e.clientY));
    ln.addEventListener('mouseleave',hideTip);
    svg.appendChild(ln);e1.push(ln);
  }
  for(let k=0;k<DFF;k++)for(let d=0;d<D;d++){
    const prod=Lw.W2[k][d]*act[k];
    const ln=sv('line',{x1:xHid,y1:yHid(k),x2:xOut,y2:yIn(d),
      stroke:prod>=0?'#ff9f57':'#5aa0ff','stroke-width':Math.max(.4,2.6*Math.abs(prod)/mx2).toFixed(2),
      'stroke-opacity':anim?0:(act[k]===0?.08:.4)});
    ln.addEventListener('mousemove',e=>showTip(`W₂[${k}][${d}] × relu[${k}]\n= ${fmt(Lw.W2[k][d],2)} × ${fmt(act[k],2)} = <b>${fmt(prod,2)}</b>`,e.clientX,e.clientY));
    ln.addEventListener('mouseleave',hideTip);
    svg.appendChild(ln);e2.push({ln,dead:act[k]===0});
  }
  function node(xx,yy,v,scale,lab,titleFn){
    const col=divColor(v,scale);
    const g=sv('g',{});
    const c=sv('circle',{cx:xx,cy:yy,r:13,fill:`rgb(${col.rgb.join(',')})`,stroke:'rgba(255,255,255,.18)','stroke-width':1});
    const t=sv('text',{class:'nv',x:xx,y:yy+27});t.textContent=fmt(v,2);
    g.appendChild(c);g.appendChild(t);
    if(lab){const lt=sv('text',{class:'nl',x:xx,y:yy-19,'text-anchor':'middle'});lt.textContent=lab;g.appendChild(lt);}
    g.addEventListener('mousemove',e=>showTip(titleFn?titleFn():fmt(v,3),e.clientX,e.clientY));
    g.addEventListener('mouseleave',hideTip);
    svg.appendChild(g);
    return {g,c,t};
  }
  const sx=maxAbs([x]),sh=maxAbs([pre]),so=maxAbs([out]);
  for(let d=0;d<D;d++)node(xIn,yIn(d),x[d],sx,d===0?'x (in)':null,()=>`x[${d}] = ${fmt(x[d],3)}`);
  const hidNodes=[];
  for(let k=0;k<DFF;k++){
    const n=node(xHid,yHid(k),pre[k],sh,k===0?'hidden (pre-ReLU)':null,
      ()=>`h[${k}] = x·W₁[:,${k}] + b₁[${k}] = ${fmt(pre[k],3)}\nafter ReLU → ${fmt(act[k],3)}`);
    hidNodes.push({n,k,dead:pre[k]<0});
    if(anim){n.g.setAttribute('opacity',0);}
  }
  const outNodes=[];
  for(let d=0;d<D;d++){
    const n=node(xOut,yIn(d),out[d],so,d===0?'FFN out':null,()=>`out[${d}] = relu·W₂[:,${d}] + b₂[${d}] = ${fmt(out[d],3)}`);
    outNodes.push(n);
    if(anim)n.g.setAttribute('opacity',0);
  }
  const relLab=sv('text',{class:'nl',x:xHid,y:Hh-4,'text-anchor':'middle'});relLab.textContent='ReLU: negatives → 0';svg.appendChild(relLab);
  if(anim){
    e1.forEach((ln,k)=>s.at(150+k*14,()=>ln.setAttribute('stroke-opacity',.4)));
    hidNodes.forEach((h,k)=>s.at(500+k*70,()=>{h.n.g.setAttribute('opacity',1);}));
    s.at(1300,()=>{
      hidNodes.forEach(h=>{if(h.dead){
        h.n.c.style.animation='reluchop .8s forwards';
        setTimeout(()=>{h.n.t.textContent='0.00';h.n.t.setAttribute('fill','#5b6883');},650);
      }});
    });
    e2.forEach((o,k)=>s.at(2200+k*12,()=>o.ln.setAttribute('stroke-opacity',o.dead?.07:.4)));
    outNodes.forEach((n,d)=>s.at(2700+d*90,()=>n.g.setAttribute('opacity',1)));
  }else{
    hidNodes.forEach(h=>{if(h.dead){h.n.c.setAttribute('fill','#1a2030');h.n.c.setAttribute('fill-opacity',.6);h.n.t.textContent=fmt(pre[h.k],2)+'→0';h.n.t.setAttribute('fill','#5b6883');}});
  }
  return svg;
}

/* legend for diverging cells */
function legendScale(){
  return el('div',{class:'legend-scale'},'<span>−</span><span class="scalebar"></span><span>+</span> &nbsp; blue = negative, orange = positive');
}
</script>
<script>/* ============================================================
   STAGES 0–8
   ============================================================ */

/* ---------------- state ---------------- */
const DEFAULT=['<bos>','the','big','cat','sat','on','the'].map(w=>stoi[w]);
const STATE={tokens:DEFAULT.slice(),layer:0,head:0,query:null,temp:1,stage:0,intuition:true,math:true,sampleTok:null,
  arc:{layer:NL-1,head:'both',mode:'one',min:.02}};
let TR=null;
function recompute(){TR=forward(STATE.tokens);if(STATE.query==null||STATE.query>TR.T-1)STATE.query=TR.T-1;}

/* ---------------- small builders ---------------- */
function stageHead(host,o){
  const eb=el('div',{class:'eyebrow'});eb.appendChild(el('span',{class:'n'},'STAGE '+String(o.n).padStart(2,'0')));eb.appendChild(el('span',{},o.eyebrow));
  host.appendChild(eb);
  host.appendChild(el('h1',{class:'st'},o.title));
  if(o.lede)host.appendChild(el('p',{class:'lede'},o.lede));
}
function panel(title,cap,replayFn){
  const p=el('div',{class:'panel'});
  const ph=el('div',{class:'phead'});
  const tx=el('div',{class:'pht'});
  if(title)tx.appendChild(el('h3',{},title));
  if(cap)tx.appendChild(el('div',{class:'cap'},cap));
  ph.appendChild(tx);
  if(replayFn){const b=el('button',{class:'replay'},'⟲ replay');b.addEventListener('click',replayFn);ph.appendChild(b);}
  p.appendChild(ph);
  return p;
}
function mtxBlock(tag,shape,elm){const b=el('div',{class:'mtx-block'});const t=el('div',{class:'mtx-tag'});t.innerHTML=tag+(shape?` <b>${shape}</b>`:'');b.appendChild(t);b.appendChild(elm);return b;}
function op(sym){return el('span',{class:'opbadge'},sym);}
function arrow(){return el('span',{class:'arrow'},'→');}
function intu(html){return el('div',{class:'callout intu'},html);}
function note(cls,html){return el('div',{class:'callout '+cls},html);}
function mathEq(host){const e=el('div',{class:'eq mathonly'});host.appendChild(e);return e;}
function eqxBox(host){const e=el('div',{class:'eqx mathonly'});host.appendChild(e);return e;}
function eqLn(box,html){const ln=el('span',{class:'ln'},html);box.appendChild(ln);return ln;}
function resetEqx(box){box.querySelectorAll('.ln,.t').forEach(n=>n.classList.remove('in'));}
function tokLabels(tokens){return tokens.map((id,i)=>disp(VOCAB[id]));}
function walkBtn(label){return el('button',{class:'walkbtn mathonly'},label||'σ walk through the numbers');}

const STAGES=[];
function S(group,def){STAGES.push(Object.assign({group},def));}

/* ============ 0 · Overview ============ */
S('The Big Picture',{map:-1,title:'A sentence in, a prediction out',render(h){
  stageHead(h,{n:0,eyebrow:'The big picture',title:'A sentence goes in. A prediction comes out.',
    lede:'This is a real, tiny transformer running live in your browser — 4-dimensional vectors, 2 attention heads, 2 layers. Every number is genuinely computed on every keystroke, never faked (see the badge in the header). We will trace one sentence through every step until it predicts the next word.'});
  /* pipeline chips, lighting up in order */
  const p=panel('The pipeline','Each box edits a set of vectors — the “residual stream.” Click any box to jump straight to it.');
  const steps=[['Tokenize','#8aa0b8',1],['Embed','#5ea0ff',2],['+ Position','#54d6e6',3],['Attention','#ff77c8',4],['Feed-Forward','#68e6a0',11],['× 2 layers','#b98cff',14],['Unembed','#ffcf6b',15],['Softmax','#ff9f57',16]];
  const map=el('div',{class:'flowrow'});map.style.gap='8px';
  const chips=[];
  steps.forEach((sd,i)=>{
    const b=el('button',{class:'stepchip'},sd[0]);
    b.style.cssText+=`border-color:${sd[1]}44;color:${sd[1]};background:${sd[1]}12;font:inherit;font-size:12.5px`;
    b.addEventListener('click',()=>goStage(sd[2]));
    map.appendChild(b);chips.push([b,sd[1]]);
    if(i<steps.length-1)map.appendChild(el('span',{class:'arrow'},'→'));
  });
  p.appendChild(map);h.appendChild(p);
  const s=seq();
  chips.forEach(([b,c],i)=>{
    s.at(400+i*260,()=>{b.classList.add('lit');b.style.boxShadow=`0 0 16px ${c}55`;});
    s.at(400+i*260+900,()=>{b.classList.remove('lit');b.style.boxShadow='';});
  });
  /* live prediction teaser */
  const last=TR.logits[TR.T-1];const probs=LA.softmaxRow(last);const top=probs.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0])[0];
  const q=panel('Right now, this model predicts:');
  const line=el('div',{style:'display:flex;align-items:center;gap:14px;flex-wrap:wrap'});
  const sent=el('div',{style:'font-family:var(--serif);font-size:19px'});
  sent.innerHTML=STATE.tokens.map(id=>`<span class="tok-pill">${disp(VOCAB[id])}</span>`).join(' ')+' <span style="color:var(--faint)">…</span>';
  line.appendChild(sent);
  line.appendChild(el('span',{class:'arrow'},'→'));
  const pred=el('div',{class:'bigpred'},'');
  const conf=el('div',{style:'font-family:var(--mono);font-size:13px;color:var(--faint)'},'');
  line.appendChild(pred);line.appendChild(conf);
  q.appendChild(line);
  s.at(600,()=>{pred.textContent=disp(VOCAB[top[1]]);pred.style.animation='popin .6s cubic-bezier(.2,.9,.3,1.4)';});
  s.at(900,()=>{const span=el('span');conf.appendChild(span);conf.appendChild(document.createTextNode('% confident'));
    tween(900,pp=>span.textContent=(100*top[0]*pp).toFixed(1));});
  /* teaser arcs */
  const cap=el('div',{class:'cap',style:'margin-top:16px'},'…and this is where it will <i>look</i> while deciding — attention, drawn live (violet = head 0, teal = head 1, layer 2). Hover a word.');
  q.appendChild(cap);
  const arcs=renderArcs({layer:NL-1,head:'both',query:TR.T-1,height:150,minW:.03});
  q.appendChild(arcs.el);
  s.at(1600,()=>arcs.flow());
  q.appendChild(note('green','<b>The magic to watch for:</b> to choose that word, the model reaches <i>backwards</i> through the sentence — to the subject and the verb — even though the current word is just “'+disp(VOCAB[STATE.tokens[TR.T-1]])+'”. By stage 8 you will see exactly where and how.'));
  h.appendChild(q);
  const dims=panel('Model dimensions','Kept deliberately small so every single number stays legible.');
  dims.appendChild(el('div',{class:'shapes',style:'line-height:1.9'},`d_model = <b>${D}</b> &nbsp; heads = <b>${H}</b> &nbsp; d_head = <b>${DH}</b> &nbsp; d_ff = <b>${DFF}</b> &nbsp; layers = <b>${NL}</b> &nbsp; vocab = <b>${VOCAB.length}</b>`));
  h.appendChild(dims);
}});

/* ============ 1 · Tokenize ============ */
S('Input → Vectors',{map:0,title:'Text → token IDs',render(h){
  stageHead(h,{n:1,eyebrow:'Tokenization',title:'From text to token IDs',
    lede:'A neural network only understands numbers. So first the text is split into known tokens, and each becomes its index in the vocabulary.'});
  if(STATE.intuition)h.appendChild(intu('<b>Analogy:</b> the vocabulary is a numbered dictionary. Tokenizing is looking up each word’s page number. This tiny dictionary has '+VOCAB.length+' entries; GPT-class models have ~100,000.'));
  const p=panel('Your sentence, splitting apart','A special ⟨bos⟩ “beginning of sentence” token is prepended so the first real word has something to look at.');
  const sentLine=el('div',{style:'font-family:var(--serif);font-size:21px;margin-bottom:18px;color:var(--ink)'},
    STATE.tokens.map((id,i)=>`<span data-w="${i}" style="transition:.4s;display:inline-block;margin-right:10px;color:${tokColor(i)}">${disp(VOCAB[id])}</span>`).join(''));
  p.appendChild(sentLine);
  const row=el('div',{class:'flowrow'});row.style.gap='18px';
  const cols=[];
  STATE.tokens.forEach((id,i)=>{
    const col=el('div',{class:'tokvec'});
    col.style.cssText='opacity:0;transform:translateY(-14px);transition:.5s cubic-bezier(.2,.8,.3,1.2)';
    const wd=el('div',{style:`font-family:var(--serif);font-size:18px;color:${tokColor(i)}`},disp(VOCAB[id]));
    const idb=el('div',{class:'tok-pill',style:'font-size:14px'},'id '+id);
    const pos=el('div',{class:'tk'},`<span class="p">position ${i}</span>`);
    col.appendChild(wd);col.appendChild(idb);col.appendChild(pos);row.appendChild(col);cols.push(col);
  });
  p.appendChild(row);h.appendChild(p);
  const s=seq();
  cols.forEach((c,i)=>s.at(250+i*140,()=>{c.style.opacity=1;c.style.transform='none';}));
  if(!MOTION.on)cols.forEach(c=>{c.style.opacity=1;c.style.transform='none';});
  const g=panel('The vocabulary','Every token this model knows. Highlighted = used in your sentence. (Edit the sentence in the bar at the top.)');
  const vg=el('div',{style:'display:flex;flex-wrap:wrap;gap:6px'});
  VOCAB.forEach((w,i)=>{const b=el('div',{class:'tok-pill',style:'font-size:12.5px;padding:3px 8px'+ (STATE.tokens.includes(i)?';border-color:var(--blue);color:var(--blue)':'')},`${i} ${disp(w)}`);vg.appendChild(b);});
  g.appendChild(vg);h.appendChild(g);
}});

/* ============ 2 · Embeddings ============ */
S('Input → Vectors',{map:1,title:'Tokens → vectors',render(h){
  stageHead(h,{n:2,eyebrow:'Token embeddings',title:'Each token becomes a vector',
    lede:'Each token ID selects one row of the embedding matrix E — a learned '+D+'-dimensional vector encoding what that word “means” to the model.'});
  if(STATE.intuition)h.appendChild(intu('<b>Analogy:</b> a giant lookup table where every word has '+D+' tuned dials. “cat” and “dog” end up with similar dial settings because they behave similarly in sentences — training did that, nobody hand-set them.'));
  const usedRows=STATE.tokens.slice();
  const p=panel('Embedding matrix E — watch your tokens pull their rows out','Rows = vocabulary · columns = feature dimensions. Hover any cell.');
  const mtx=renderMatrix({data:MODEL.E,cw:44,ch:22,mode:'div',ylabels:VOCAB.map(disp),xlabels:Array.from({length:D},(_,i)=>'d'+i),
    dimExcept:(i,j)=>usedRows.includes(i),
    tip:(i,j,v)=>`E[${disp(VOCAB[i])}][d${j}] = ${fmt(v,3)}`});
  const sc=el('div',{class:'scrollx'});sc.appendChild(mtx);p.appendChild(sc);
  p.appendChild(legendScale());
  h.appendChild(p);
  /* lookup + scale, with walkthrough */
  const q=panel('Look-up, then scale by √d_model','Each picked row is multiplied by √'+D+' = '+SCALE.toFixed(2)+' so token meaning starts on a comparable footing with the positional signal (next stage).',()=>walk());
  const eq=mathEq(q);eq.innerHTML=`<i>x</i><span class="sc">i</span> <span class="op">=</span> √d<span class="sc">model</span> · E[ token<span class="sc">i</span> ]`;
  const row=el('div',{class:'vecrow'});row.style.marginTop='10px';
  const vecs=[];
  STATE.tokens.forEach((id,i)=>{
    const v=renderColVec(TR.tokEmb[i],{label:`<span style="color:${tokColor(i)}">${disp(VOCAB[id])}</span>`,cw:40,pre:true,tip:(d,vv)=>`${disp(VOCAB[id])} · d${d} = ${fmt(vv,3)}\n= ${SCALE.toFixed(2)} × ${fmt(MODEL.E[id][d],3)}`});
    row.appendChild(v);vecs.push(v);
  });
  q.appendChild(row);
  const wi=Math.min(3,TR.T-1);
  const ex=eqxBox(q);
  const id=STATE.tokens[wi];
  const l1=eqLn(ex,`e.g. token “<span style="color:${tokColor(wi)}">${disp(VOCAB[id])}</span>” (id ${id}):&nbsp; x = ${SCALE.toFixed(0)} × <span class="mono">[${MODEL.E[id].map(v=>`<span class="t">${fmt(v,2)}</span>`).join(', ')}]</span>`);
  const l2=eqLn(ex,`&nbsp;&nbsp;&nbsp;= <span class="mono resg">[${TR.tokEmb[wi].map(v=>`<span class="t">${fmt(v,2)}</span>`).join(', ')}]</span> — meaning, amplified, ready for position info.`);
  function walk(){
    resetEqx(ex);
    const s=seq();
    /* rows pull out */
    STATE.tokens.forEach((tid,i)=>{
      s.at(200+i*150,()=>{flashCells(mtx,Array.from({length:D},(_,j)=>[tid,j]));});
      s.at(350+i*150,()=>{vecs[i]._cells.forEach(c=>c.classList.remove('pre'));});
    });
    s.t=200+STATE.tokens.length*150+300;
    lineIn(s,l1,300);
    revealTerms(l1,s,220,(k)=>{flashCells(mtx,[[id,k]]);});
    lineIn(s,l2,350);
    revealTerms(l2,s,220,(k)=>{flashVec(vecs[wi],[k],'flashg');});
  }
  h.appendChild(q);
  walk();
}});

/* ============ 3 · Positional encoding ============ */
S('Input → Vectors',{map:2,title:'+ Position',render(h){
  stageHead(h,{n:3,eyebrow:'Positional encoding',title:'Injecting a sense of order',
    lede:'Attention treats its input as a bag of vectors — no built-in order. So before anything mixes, each position adds a unique wave-based signature to its vector.'});
  if(STATE.intuition)h.appendChild(intu('<b>Analogy:</b> sine and cosine waves of different frequencies are like clock hands spinning at different speeds. Read all the hands at once and you know exactly what time — which <i>position</i> — it is. Fast hands distinguish neighbours; slow hands distinguish far-apart positions.'));
  const p=panel('The waves, drawing themselves','Each dimension of the position signature is one wave read at integer positions. Dots = the positions in your sentence. Hover a dot for its value.',()=>renderStage());
  p.appendChild(renderWaves());
  const eq=mathEq(p);eq.innerHTML=`PE<span class="sc">pos,2i</span> = sin(pos / 10000<span class="sup">2i/d</span>) &nbsp;&nbsp; PE<span class="sc">pos,2i+1</span> = cos(pos / 10000<span class="sup">2i/d</span>)`;
  p.appendChild(el('div',{class:'eqnote'},'d0–d1 spin fast (period 2π positions); d2–d3 spin 100× slower — in a 9-token sentence they barely move, but in long texts they are what separates “word 12” from “word 512”.'));
  h.appendChild(p);
  /* the matrix + the add */
  const q=panel('Add it in:  x + PE — the residual stream is born','The meaning vector and the position signature are simply added, entry by entry.',()=>walk());
  const i=Math.min(3,STATE.tokens.length-1);
  const fr=el('div',{class:'flowrow'});
  const vTok=renderColVec(TR.tokEmb[i],{cw:44});
  const vPE=renderColVec(TR.PEused[i],{cw:44,tip:(d,v)=>`PE[pos ${i}][d${d}] = ${fmt(v,3)}`});
  const vX0=renderColVec(TR.X0[i],{cw:44,pre:true});
  fr.appendChild(mtxBlock(`token “${disp(VOCAB[STATE.tokens[i]])}”`,`${D}`,vTok));
  fr.appendChild(op('+'));
  fr.appendChild(mtxBlock(`position ${i}`,`${D}`,vPE));
  fr.appendChild(op('='));
  fr.appendChild(mtxBlock('<span class="cX">x₀ — into the stream</span>',`${D}`,vX0));
  q.appendChild(fr);
  const ex=eqxBox(q);
  const lns=[];
  for(let d=0;d<Math.min(2,D);d++){
    lns.push([d,eqLn(ex,`d${d}: <span class="t">${fmt(TR.tokEmb[i][d],2)}</span> <span class="t">+ ${fmt(TR.PEused[i][d],2)}</span> <span class="t">= <span class="res">${fmt(TR.X0[i][d],2)}</span></span>`)]);
  }
  function walk(){
    resetEqx(ex);
    vX0._cells.forEach(c=>c.classList.add('pre'));
    const s=seq();
    lns.forEach(([d,ln])=>{
      lineIn(s,ln,260);
      const ts=ln.querySelectorAll('.t');
      s.step(320,()=>{ts[0].classList.add('in');flashVec(vTok,[d]);});
      s.step(320,()=>{ts[1].classList.add('in');flashVec(vPE,[d],'flashb');});
      s.step(380,()=>{ts[2].classList.add('in');vX0._cells[d].classList.remove('pre');flashVec(vX0,[d],'flashg');});
    });
    s.step(200,()=>{});
    for(let d=2;d<D;d++)s.step(160,()=>{vX0._cells[d].classList.remove('pre');flashVec(vX0,[d],'flashg');});
  }
  q.appendChild(note('blue','<b>The residual stream.</b> From here on, every block <i>reads</i> this stream and <i>adds</i> its edit back. The vectors keep this exact shape ('+D+' numbers per token) the whole way through — think of it as a shared notepad the layers keep annotating.'));
  h.appendChild(q);
  walk();
}});

/* ============ 4 · Q K V ============ */
S('Attention',{map:3,title:'Query · Key · Value',render(h){
  const l=STATE.layer;
  stageHead(h,{n:4,eyebrow:'Self-attention · layer '+(l+1),title:'Every token takes on three roles',
    lede:'Attention lets tokens exchange information. To decide who talks to whom, each token’s vector is projected into three new vectors by three learned weight matrices.'});
  if(STATE.intuition)h.appendChild(intu('<b>Analogy — a search engine:</b> each token issues a <b class="cQ">Query</b> (“what am I looking for?”), advertises a <b class="cK">Key</b> (“what do I offer?”), and carries a <b class="cV">Value</b> (“what I actually hand over if you pick me”).'));
  /* one entry by hand */
  const qi=STATE.query;
  const labs=tokLabels(STATE.tokens);
  const w1=panel('One entry, computed by hand','Everything here is just x·W. Watch a single number of Q get built: the query row × a weight column.',()=>walk());
  const fr=el('div',{class:'flowrow'});fr.style.alignItems='flex-start';
  const xv=renderColVec(TR.layers[l].Xin[qi],{cw:44,label:`x — “${disp(VOCAB[STATE.tokens[qi]])}”`});
  const wq=renderMatrix({data:MODEL.layers[l].WQ,cw:40,ch:22,xlabels:['c0','c1','c2','c3'],ylabels:['d0','d1','d2','d3'],
    tip:(i,j,v)=>`W_Q[${i}][${j}] = ${fmt(v,3)}`});
  fr.appendChild(mtxBlock('<span class="cX">x (stream)</span>',`${D}`,xv));
  fr.appendChild(op('·'));
  fr.appendChild(mtxBlock('<span class="cQ">W_Q</span>',`${D}×${D}`,wq));
  const qv=renderColVec(TR.layers[l].Q[qi],{cw:44,pre:true,label:'<span class="cQ">Q row</span>'});
  fr.appendChild(op('='));
  fr.appendChild(mtxBlock(`<span class="cQ">Q[“${disp(VOCAB[STATE.tokens[qi]])}”]</span>`,`${D}`,qv));
  w1.appendChild(fr);
  const ex=eqxBox(w1);
  const terms=Array.from({length:D},(_,d)=>`<span class="t">${d?' + ':''}(${fmt(TR.layers[l].Xin[qi][d],2)})(${fmt(MODEL.layers[l].WQ[d][0],2)})</span>`).join('');
  const lA=eqLn(ex,`Q[0] &nbsp;=&nbsp; Σ<span class="sc">d</span> x[d] · W<span class="sc">Q</span>[d][0] &nbsp;=&nbsp; ${terms} <span class="t">= <span class="res">${fmt(TR.layers[l].Q[qi][0],2)}</span></span>`);
  const lB=eqLn(ex,`…and every other entry of <span class="cQ">Q</span>, <span class="cK">K</span>, <span class="cV">V</span> fills in exactly the same way, from its own weight matrix:`);
  function walk(){
    resetEqx(ex);
    qv._cells.forEach(c=>c.classList.add('pre'));
    const s=seq();
    lineIn(s,lA,300);
    const ts=lA.querySelectorAll('.t');
    for(let d=0;d<D;d++){
      s.step(430,()=>{ts[d].classList.add('in');flashVec(xv,[d],'flashb');flashCells(wq,[[d,0]]);});
    }
    s.step(430,()=>{ts[D].classList.add('in');qv._cells[0].classList.remove('pre');flashVec(qv,[0]);});
    s.step(300,()=>{for(let d=1;d<D;d++)setTimeout(()=>{qv._cells[d].classList.remove('pre');},d*120);});
    lineIn(s,lB,350);
    s.step(200,()=>{sweepIn(qm,seq(),6);sweepIn(km,seq(),6);sweepIn(vm,seq(),6);});
  }
  h.appendChild(w1);
  /* full Q K V */
  const p=panel('All three projections of the whole sentence','Same input matrix X, three different learned lenses.');
  const eq=mathEq(p);eq.innerHTML=`Q = <i>X</i> W<span class="sc">Q</span> &nbsp;&nbsp; K = <i>X</i> W<span class="sc">K</span> &nbsp;&nbsp; V = <i>X</i> W<span class="sc">V</span>`;
  const grid=el('div',{class:'vecrow'});grid.style.gap='22px';
  const qm=renderMatrix({data:TR.layers[l].Q,cw:40,ch:24,ylabels:labs,pre:true,tip:(i,j,v)=>`Q[${labs[i]}][${j}] = ${fmt(v,3)}`});
  const km=renderMatrix({data:TR.layers[l].K,cw:40,ch:24,ylabels:labs,pre:true,tip:(i,j,v)=>`K[${labs[i]}][${j}] = ${fmt(v,3)}`});
  const vm=renderMatrix({data:TR.layers[l].Vv,cw:40,ch:24,ylabels:labs,pre:true,tip:(i,j,v)=>`V[${labs[i]}][${j}] = ${fmt(v,3)}`});
  grid.appendChild(mtxBlock('<span class="cQ">Q — queries</span>',`${TR.T}×${D}`,qm));
  grid.appendChild(mtxBlock('<span class="cK">K — keys</span>',`${TR.T}×${D}`,km));
  grid.appendChild(mtxBlock('<span class="cV">V — values</span>',`${TR.T}×${D}`,vm));
  p.appendChild(grid);h.appendChild(p);
  /* heads */
  const q2=panel('Split into '+H+' heads','The '+D+' columns are sliced into '+H+' independent heads of '+DH+' dims each — each head gets to learn a different kind of relationship, in parallel.');
  const hz=el('div',{class:'flowrow'});hz.style.gap='24px';
  for(let hh=0;hh<H;hh++){
    hz.appendChild(mtxBlock(`<span style="color:${HEADC[hh]}">head ${hh}</span> · Q<span class="sc">h</span>`,`${TR.T}×${DH}`,
      renderMatrix({data:TR.layers[l].heads[hh].Qh,cw:42,ch:24,ylabels:labs,tip:(i,j,v)=>`head ${hh} Q[${labs[i]}][${j}] = ${fmt(v,3)}`})));
  }
  q2.appendChild(hz);
  if(STATE.intuition)q2.appendChild(intu('<b>Why heads?</b> One head might track word order, another might link subjects to verbs. You’ll see them specialise for real on stage 8.'));
  h.appendChild(q2);
  walk();
}});

/* ============ 5 · Scores ============ */
S('Attention',{map:3,title:'Scores: Q · K',render(h){
  const l=STATE.layer,hh=STATE.head,qi=STATE.query;
  stageHead(h,{n:5,eyebrow:'Attention scores',title:'Scoring every pair with a dot product',
    lede:'For each query token, compare its Query vector with every token’s Key vector via a dot product. Aligned vectors → big score → strong attention.'});
  h.appendChild(headQueryControls());
  if(DH===2){
    const p=panel('The geometry of a dot product','Head '+hh+' has d_head = 2, so we can literally plot it. The amber arrow is the current query; each dot is a key. A key’s shadow <i>along</i> the query direction (dashed gold axis) IS its score.',()=>renderStage());
    p.appendChild(renderGeo(l,hh,qi,true));
    const hd=TR.layers[l].heads[hh];
    let tk=0;for(let j=0;j<=qi;j++)if(hd.A[qi][j]>hd.A[qi][tk])tk=j;
    const leg=el('div',{class:'geolegend'});
    leg.innerHTML=`<span><span class="keydot" style="background:#ffcf6b"></span>query “${disp(VOCAB[STATE.tokens[qi]])}”</span>`+
      `<span>dot size = attention weight</span><span>dashed gold = score axis</span>`;
    p.appendChild(leg);
    if(STATE.intuition)p.appendChild(intu(`<b>Read it geometrically:</b> keys pointing the <i>same way</i> as the amber arrow land far along the gold axis → high score. Keys pointing away score negative. Right now “${disp(VOCAB[STATE.tokens[qi]])}” aligns most with <b>“${disp(VOCAB[STATE.tokens[tk]])}”</b>.`));
    h.appendChild(p);
    /* exact arithmetic with flashing */
    const b=panel('The exact arithmetic','Query and its top-matching key, term by term.',()=>walk());
    const q=hd.Qh[qi],k=hd.Kh[tk];
    const fr=el('div',{class:'flowrow'});
    const qvec=renderColVec(q,{cw:46,label:`<span class="cQ">Q<span style="font-size:10px"> h${hh}</span> “${disp(VOCAB[STATE.tokens[qi]])}”</span>`});
    const kvec=renderColVec(k,{cw:46,label:`<span class="cK">K<span style="font-size:10px"> h${hh}</span> “${disp(VOCAB[STATE.tokens[tk]])}”</span>`});
    fr.appendChild(mtxBlock('','',qvec));fr.appendChild(op('·'));fr.appendChild(mtxBlock('','',kvec));
    b.appendChild(fr);
    const ex=eqxBox(b);
    const terms=q.map((qv,d)=>`<span class="t">${d?' + ':''}(${fmt(qv,2)})(${fmt(k[d],2)})</span>`).join('');
    const lA=eqLn(ex,`Q·K = ${terms} <span class="t">= <span class="res">${fmt(LA.dot(q,k),2)}</span></span>`);
    const lB=eqLn(ex,`score = ${fmt(LA.dot(q,k),2)} ÷ √${DH} = <span class="res">${fmt(hd.raw[qi][tk],2)}</span> &nbsp;<span class="eqnote">÷√d_head keeps scores tame as heads grow — it protects the softmax coming next.</span>`);
    function walk(){
      resetEqx(ex);
      const s=seq();
      lineIn(s,lA,300);
      const ts=lA.querySelectorAll('.t');
      q.forEach((_,d)=>s.step(450,()=>{ts[d].classList.add('in');flashVec(qvec,[d]);flashVec(kvec,[d],'flashb');}));
      s.step(430,()=>ts[q.length].classList.add('in'));
      lineIn(s,lB,400);
    }
    h.appendChild(b);
    walk();
  }
  const sm=panel('All scores at once:  Q Kᵀ ⁄ √d_head','Row = query · column = key. Your selected query row is outlined — click any row to switch. (Un-masked, for one more stage.)');
  const raw=TR.layers[l].heads[hh].raw;
  const labs=tokLabels(STATE.tokens);
  const smx=renderMatrix({data:raw,cw:46,ch:30,ylabels:labs.map(x=>x+' ›'),xlabels:labs,hlRows:[qi],pre:true,
    tip:(i,j,v)=>`${labs[i]} → ${labs[j]}\nscore = ${fmt(v,3)}`,
    onCell:(cell,i,j)=>cell.addEventListener('click',()=>{STATE.query=i;renderStage();})});
  const scw=el('div',{class:'scrollx'});scw.appendChild(smx);sm.appendChild(scw);
  sm.appendChild(el('div',{class:'eqnote',style:'margin-top:8px'},'Tip: click any row to make it the active query.'));
  h.appendChild(sm);
  sweepIn(smx,seq(),7);
}});

/* ============ 6 · Mask ============ */
S('Attention',{map:3,title:'Causal mask',render(h){
  const l=STATE.layer,hh=STATE.head;
  stageHead(h,{n:6,eyebrow:'Causal mask',title:'No peeking at the future',
    lede:'This model predicts the next word — so a token must never attend to tokens after itself. Enforcement is brutal and simple: set every future score to −∞.'});
  if(STATE.intuition)h.appendChild(intu('<b>Why?</b> During training, the answer (the next word) sits right there in the sequence. Without the mask the model could cheat by looking ahead — and would learn nothing useful. The mask forces every prediction to use only the past.'));
  h.appendChild(headQueryControls());
  const p=panel('Watch the mask fall','Each hatched cell becomes −∞ → after softmax, exactly 0 attention. Every token keeps itself and its past; the future goes dark.',()=>renderStage());
  const raw=TR.layers[l].heads[hh].raw;const labs=tokLabels(STATE.tokens);
  const mx=renderMatrix({data:raw,cw:46,ch:30,ylabels:labs.map(x=>x+' ›'),xlabels:labs,hlRows:[STATE.query],
    tip:(i,j,v)=>j>i?`${labs[i]} → ${labs[j]}: masked (−∞)`:`${labs[i]} → ${labs[j]} = ${fmt(v,3)}`});
  p.appendChild(el('div',{class:'scrollx'})).appendChild(mx);
  h.appendChild(p);
  /* curtain animation: diagonal by diagonal */
  const s=seq();
  const T=TR.T;
  for(let d=1;d<T;d++){
    s.at(500+d*260,()=>{
      for(let i=0;i+d<T;i++){
        const cell=mx._cells[i][i+d];
        cell.classList.add('masked');
        cell.style.background='';cell.style.color='';
        cell.textContent='−∞';
      }
    });
  }
  if(!MOTION.on){for(let i=0;i<T;i++)for(let j=i+1;j<T;j++){const c=mx._cells[i][j];c.classList.add('masked');c.style.background='';c.style.color='';c.textContent='−∞';}}
  const q=panel('Why −∞ and not just 0?');
  const ex=eqxBox(q);
  const lA=eqLn(ex,`softmax turns scores into weights via exp:&nbsp; exp(−∞) = <span class="res">0</span> &nbsp;→ truly invisible.`);
  const lB=eqLn(ex,`but exp(0) = <span class="res">1</span> &nbsp;→ a score of 0 would still get real attention. Zero is an opinion; −∞ is silence.`);
  const s2=seq();lineIn(s2.wait(1800),lA,400);lineIn(s2,lB,500);
  h.appendChild(q);
}});

/* ============ 7 · Softmax → weights ============ */
S('Attention',{map:3,title:'Softmax → weights',render(h){
  const l=STATE.layer,hh=STATE.head,qi=STATE.query;
  stageHead(h,{n:7,eyebrow:'Softmax',title:'Scores become a probability of looking',
    lede:'Softmax squashes each row of scores into positive weights summing to 1 — a budget of attention for “where should this token look?”.'});
  h.appendChild(headQueryControls());
  const hd=TR.layers[l].heads[hh];const labs=tokLabels(STATE.tokens);
  /* three-phase morph */
  const p=panel(`Row “${disp(VOCAB[STATE.tokens[qi]])}”, morphing through softmax`,'Watch the same row pass through all three steps.',()=>walk());
  const phase=el('div',{style:'font-family:var(--mono);font-size:12px;color:var(--amber);margin-bottom:10px;min-height:16px'},'');
  p.appendChild(phase);
  const items0=()=>{const a=[];for(let j=0;j<=qi;j++)a.push({label:labs[j],val:Math.abs(hd.masked[qi][j])<=Math.abs(NEG/2)?Math.abs(hd.masked[qi][j]):0,});return a;};
  const bars=renderBars([],{});
  p.appendChild(bars);
  const ex=eqxBox(p);
  const exps=[];let Z=0;for(let j=0;j<=qi;j++){exps.push(Math.exp(hd.masked[qi][j]-Math.max(...hd.masked[qi].slice(0,qi+1))));}
  const rawRow=hd.masked[qi].slice(0,qi+1);
  const mxRow=Math.max(...rawRow);
  Z=exps.reduce((a,b)=>a+b,0);
  const lA=eqLn(ex,`a<span class="sc">j</span> = exp(s<span class="sc">j</span>) ⁄ Σ exp &nbsp;&nbsp;<span class="eqnote">(computed stably: subtract the max score, ${fmt(mxRow,2)}, first — same result, no overflow)</span>`);
  const lB=eqLn(ex,`exp: <span class="mono">[${exps.map(e=>`<span class="t">${fmt(e,2)}</span>`).join(', ')}]</span> &nbsp; Σ = <span class="res">${fmt(Z,2)}</span>`);
  const lC=eqLn(ex,`÷ Σ → <span class="mono resg">[${exps.map(e=>`<span class="t">${(100*e/Z).toFixed(1)}%</span>`).join(', ')}]</span> — sums to exactly 100%.`);
  function walk(){
    resetEqx(ex);
    const s=seq();
    s.step(100,()=>{phase.textContent='① raw scores (magnitude; blue = negative score)';
      bars._update(rawRow.map((v,j)=>({label:labs[j],val:Math.abs(v),fillStyle:v>=0?'linear-gradient(90deg,var(--orange),var(--amber))':'linear-gradient(90deg,var(--blue-2),var(--blue))'})),{pct:false,dec:2});});
    lineIn(s.wait(1000),lA,200);
    s.step(900,()=>{phase.textContent='② exponentiate — negatives shrink toward 0, positives explode';
      bars._update(exps.map((e,j)=>({label:labs[j],val:e,fillStyle:'linear-gradient(90deg,var(--blue),var(--cyan))'})),{pct:false,dec:2});});
    lineIn(s,lB,250);
    revealTerms(lB,s,140);
    s.step(900,()=>{phase.textContent='③ divide by the sum — a clean attention budget (green = winner)';
      const mxw=Math.max(...exps);
      bars._update(exps.map((e,j)=>({label:labs[j],val:e/Z,top:e===mxw})),{pct:true,max:1});});
    lineIn(s,lC,250);
    revealTerms(lC,s,140);
  }
  h.appendChild(p);
  walk();
  const q=panel('The full attention map A','Every row is now a distribution (rows sum to 1). Bright = strong. This is the complete “who reads from whom” wiring of head '+hh+' — and the next stage makes it breathe.');
  const am=renderMatrix({data:hd.A,cw:46,ch:30,mode:'seq',ylabels:labs.map(x=>x+' ›'),xlabels:labs,maskUpper:true,hlRows:[qi],pre:true,
    tip:(i,j,v)=>j>i?'masked':`${labs[i]} attends to ${labs[j]}: ${(100*v).toFixed(1)}%`,
    onCell:(cell,i,j)=>cell.addEventListener('click',()=>{STATE.query=i;renderStage();})});
  q.appendChild(el('div',{class:'scrollx'})).appendChild(am);
  maybeLookbackNote(q,l,hh);
  h.appendChild(q);
  sweepIn(am,seq().wait(600),7);
}});

/* ============ 8 · Attention theater ============ */
S('Attention',{map:3,title:'Attention, alive ✨',render(h){
  stageHead(h,{n:8,eyebrow:'The payoff view',title:'Attention, drawn over the sentence itself',
    lede:'The same numbers as the matrix — but now as living connections. Arc thickness = attention weight. Hover any word to audition it as the query; click to lock it in.'});
  const a=STATE.arc;
  /* controls */
  const ctl=el('div',{style:'display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:6px 0 4px'});
  const mkseg=(label,opts,cur,cb)=>{
    const w=el('div',{class:'pick'});w.appendChild(el('span',{},label));
    const s=el('div',{class:'seg'});
    opts.forEach(([val,txt,color])=>{
      const b=el('button',val===cur?{class:'on'}:{},txt);
      if(color&&val!==cur)b.style.color=color;
      b.addEventListener('click',()=>cb(val));
      s.appendChild(b);
    });
    w.appendChild(s);return w;
  };
  ctl.appendChild(mkseg('layer',[[0,'layer 1'],[1,'layer 2']],a.layer,v=>{a.layer=v;renderStage();}));
  ctl.appendChild(mkseg('head',[['0','head 0',HEADC[0]],['1','head 1',HEADC[1]],['both','both']],a.head,v=>{a.head=v;renderStage();}));
  ctl.appendChild(mkseg('view',[['one','one query'],['all','whole wiring']],a.mode,v=>{a.mode=v;renderStage();}));
  h.appendChild(ctl);
  const p=panel(null,null);
  const arcs=renderArcs({layer:a.layer,head:a.head,query:STATE.query,all:a.mode==='all',minW:a.min,height:210,
    onPick:(i)=>{STATE.query=i;}});
  p.appendChild(arcs.el);
  /* legend + min-weight + flow */
  const leg=el('div',{class:'arclegend'});
  leg.innerHTML=`<span><span class="sw" style="border-color:${HEADC[0]}"></span>head 0</span>`+
    `<span><span class="sw dash" style="border-color:${HEADC[1]}"></span>head 1</span>`+
    `<span>thickness = weight</span>`;
  const mw=el('span',{class:'pick',style:'margin-left:auto'});
  mw.appendChild(el('span',{},'hide below'));
  const sl=el('input',{type:'range',min:'0',max:'0.2',step:'0.01',class:'slider',style:'width:110px'});sl.value=a.min;
  const mwv=el('span',{class:'tok-pill'},(100*a.min).toFixed(0)+'%');
  sl.addEventListener('input',()=>{a.min=parseFloat(sl.value);mwv.textContent=(100*a.min).toFixed(0)+'%';arcs.update({minW:a.min});});
  mw.appendChild(sl);mw.appendChild(mwv);
  const fb=el('button',{class:'walkbtn',style:'margin:0'},'⇣ pulse the information flow');
  fb.addEventListener('click',()=>arcs.flow());
  leg.appendChild(fb);
  leg.appendChild(mw);
  p.appendChild(leg);
  h.appendChild(p);
  seq().at(900,()=>arcs.flow());
  /* interpretation */
  const q=panel('What the heads learned','Two heads, one layer apart, doing visibly different jobs. (Maps for the current layer.)');
  const labs=tokLabels(STATE.tokens);
  const cmp=el('div',{class:'flowrow'});cmp.style.gap='26px';
  for(let hh2=0;hh2<H;hh2++){
    const hd=TR.layers[a.layer].heads[hh2];
    cmp.appendChild(mtxBlock(`<span style="color:${HEADC[hh2]}">layer ${a.layer+1} · head ${hh2}</span>`,'',
      renderMatrix({data:hd.A,cw:30,ch:22,mode:'seq',maskUpper:true,ylabels:labs,xlabels:labs,
        tip:(i,j,v)=>j>i?'masked':`${labs[i]} → ${labs[j]}: ${(100*v).toFixed(1)}%`})));
  }
  q.appendChild(cmp);
  let noted=false;
  for(let hh2=0;hh2<H&&!noted;hh2++){noted=maybeLookbackNote(q,a.layer,hh2);}
  h.appendChild(q);
}});
</script>
<script>/* ============================================================
   STAGES 9–18 + controls + controller + boot
   ============================================================ */

/* ============ 9 · Weighted sum of values ============ */
S('Attention',{map:3,title:'Mix the Values',render(h){
  const l=STATE.layer,hh=STATE.head,qi=STATE.query;
  stageHead(h,{n:9,eyebrow:'Weighted sum',title:'Pour the Values together',
    lede:'Each token now builds its outgoing message: every token’s Value vector, scaled by the attention weight just computed, poured into one context vector.'});
  if(STATE.intuition)h.appendChild(intu('<b>Analogy:</b> the query voted on who to listen to. Now it holds out a cup, and every token pours in a little of its <b class="cV">Value</b> — a big glug from high-attention tokens, barely a drop from the rest.'));
  h.appendChild(headQueryControls());
  const hd=TR.layers[l].heads[hh];
  const p=panel(`Building the context vector for “${disp(VOCAB[STATE.tokens[qi]])}” — head ${hh}`,'Watch the running sum accumulate, token by token.',()=>walk());
  const eq=mathEq(p);eq.innerHTML=`context<span class="sc">i</span> = Σ<span class="sc">j</span> a<span class="sc">ij</span> · V<span class="sc">j</span>`;
  const fr=el('div',{class:'flowrow'});fr.style.alignItems='flex-end';fr.style.gap='10px';
  const blocks=[];
  for(let j=0;j<=qi;j++){
    const w=hd.A[qi][j];
    const blk=el('div',{class:'tokvec'});
    blk.appendChild(el('div',{class:'tk'},`<span style="color:${tokColor(j)}">${disp(VOCAB[STATE.tokens[j]])}</span>`));
    const vv=renderColVec(hd.Vh[j],{mode:'div',cw:36,ch:20,tip:(d,val)=>`V[${disp(VOCAB[STATE.tokens[j]])}][${d}] = ${fmt(val,3)}\n× a = ${fmt(w*val,3)}`});
    blk.appendChild(vv);
    const wl=el('div',{class:'tk'},`× <b style="color:${w>0.15?'var(--green)':'var(--faint)'}">${(100*w).toFixed(0)}%</b>`);
    blk.appendChild(wl);
    fr.appendChild(blk);
    blocks.push({blk,vv,w,j});
    if(j<qi)fr.appendChild(op('+'));
  }
  fr.appendChild(op('='));
  const scaleCtx=maxAbs([hd.ctxh[qi]]);
  const ctxVec=renderColVec(hd.ctxh[qi],{cw:44,ch:22,scale:scaleCtx,label:'<span style="color:var(--teal)">context</span>'});
  fr.appendChild(mtxBlock('<span style="color:var(--teal)">context — the cup</span>',`${DH}`,ctxVec));
  p.appendChild(fr);
  const runNote=el('div',{class:'eqnote',style:'margin-top:10px;min-height:16px;font-family:var(--mono)'},'');
  p.appendChild(runNote);
  function walk(){
    const s=seq();
    const partial=new Array(DH).fill(0);
    blocks.forEach(b=>{b.blk.style.transition='opacity .4s';b.blk.style.opacity=.25;});
    s.step(300,()=>{ctxVec._cells.forEach((c,d)=>{c.textContent='0.00';c.style.background='rgb(13,17,26)';c.style.color='rgba(255,255,255,.92)';});runNote.textContent='cup starts empty: [0, 0]';});
    blocks.forEach(({blk,vv,w,j})=>{
      s.step(750,()=>{
        blk.style.opacity=0.35+0.65*Math.min(1,w*2.2);
        flashVec(vv,Array.from({length:DH},(_,d)=>d),'flashg');
        for(let d=0;d<DH;d++)partial[d]+=w*hd.Vh[j][d];
        ctxVec._cells.forEach((c,d)=>{
          const col=divColor(partial[d],scaleCtx);
          c.style.background=`rgb(${col.rgb.join(',')})`;c.style.color=textOn(col.rgb);
          c.textContent=fmt(partial[d],2);
        });
        flashVec(ctxVec,Array.from({length:DH},(_,d)=>d));
        runNote.textContent=`+ ${(100*w).toFixed(0)}% of “${disp(VOCAB[STATE.tokens[j]])}” → cup now [${partial.map(v=>fmt(v,2)).join(', ')}]`;
      });
    });
    s.step(400,()=>{runNote.textContent='full: context = ['+hd.ctxh[qi].map(v=>fmt(v,2)).join(', ')+'] — mostly made of the tokens it attended to.';});
  }
  h.appendChild(p);
  walk();
}});

/* ============ 10 · Heads recombine ============ */
S('Attention',{map:3,title:'Recombine the heads',render(h){
  const l=STATE.layer;
  stageHead(h,{n:10,eyebrow:'Multi-head output',title:'Many heads, then recombine',
    lede:'Each head produced its own '+DH+'-dim context. Concatenate them back to '+D+' dims, then one more learned projection W_O blends what the heads found into a single edit.'});
  const p=panel('Concatenate → project with W_O','');
  const labs=tokLabels(STATE.tokens);
  const fr=el('div',{class:'flowrow'});
  for(let hh=0;hh<H;hh++){
    const hd=TR.layers[l].heads[hh];
    fr.appendChild(mtxBlock(`<span style="color:${HEADC[hh]}">head ${hh} context</span>`,`${TR.T}×${DH}`,
      renderMatrix({data:hd.ctxh,cw:40,ch:22,ylabels:labs,tip:(i,j,v)=>`head ${hh} ctx[${labs[i]}][${j}] = ${fmt(v,3)}`})));
  }
  fr.appendChild(op('concat'));
  fr.appendChild(op('· W_O'));
  const ao=renderMatrix({data:TR.layers[l].attnOut,cw:40,ch:22,ylabels:labs,pre:true,tip:(i,j,v)=>`attn out[${labs[i]}][${j}] = ${fmt(v,3)}`});
  fr.appendChild(mtxBlock('attention’s edit',`${TR.T}×${D}`,ao));
  p.appendChild(fr);
  if(STATE.intuition)p.appendChild(intu('<b>Why many heads?</b> One head can only mix with one attention pattern. Two heads = two different “who reads whom” wirings running in parallel — W_O decides how much of each head’s report makes it into the stream.'));
  h.appendChild(p);
  sweepIn(ao,seq().wait(400),8);
  const q=panel('The two heads really did specialise','Same layer, same input — visibly different routing.');
  const cmp=el('div',{class:'flowrow'});cmp.style.gap='26px';
  for(let hh=0;hh<H;hh++){const hd=TR.layers[l].heads[hh];
    cmp.appendChild(mtxBlock(`<span style="color:${HEADC[hh]}">head ${hh}</span>`,'',
      renderMatrix({data:hd.A,cw:30,ch:22,mode:'seq',maskUpper:true,ylabels:labs,xlabels:labs})));}
  q.appendChild(cmp);h.appendChild(q);
}});

/* ============ 11 · Add & Norm ============ */
S('Residual & MLP',{map:4,title:'Add & Norm',render(h){
  const l=STATE.layer,i=STATE.query;
  stageHead(h,{n:11,eyebrow:'Residual + LayerNorm',title:'Attention’s output is an edit, not a replacement',
    lede:'The attention result is added back onto the original vector (a residual connection). Then LayerNorm re-centres and re-scales, so nothing drifts or explodes as layers stack.'});
  if(STATE.intuition)h.appendChild(intu('<b>The notepad idea:</b> attention doesn’t overwrite the token’s vector — it writes a <i>correction</i> that gets added on. Information can always flow through untouched, which is what makes deep stacks trainable.'));
  h.appendChild(queryOnlyControl());
  const p=panel(`For token “${disp(VOCAB[STATE.tokens[i]])}”`,'residual add → normalise.',()=>walk());
  const fr=el('div',{class:'flowrow'});
  const vIn=renderColVec(TR.layers[l].Xin[i],{cw:42});
  const vAo=renderColVec(TR.layers[l].attnOut[i],{cw:42});
  const vSum=renderColVec(TR.layers[l].add1[i],{cw:42,pre:true});
  const vOut=renderColVec(TR.layers[l].X1[i],{cw:42,pre:true});
  fr.appendChild(mtxBlock('x (in)',`${D}`,vIn));
  fr.appendChild(op('+'));
  fr.appendChild(mtxBlock('attn edit',`${D}`,vAo));
  fr.appendChild(op('='));
  fr.appendChild(mtxBlock('sum',`${D}`,vSum));
  fr.appendChild(op('LayerNorm'));
  fr.appendChild(mtxBlock('<span style="color:var(--blue)">x₁ (out)</span>',`${D}`,vOut));
  p.appendChild(fr);
  /* number-line recentering */
  const ln=TR.layers[l].ln1[i];
  const nlW=560,nlH=90;
  const nl=sv('svg',{viewBox:`0 0 ${nlW} ${nlH}`,style:'max-width:100%;display:block;margin-top:14px'});
  const axisY=nlH/2+8;
  nl.appendChild(sv('line',{x1:20,y1:axisY,x2:nlW-20,y2:axisY,stroke:'rgba(150,170,210,.3)','stroke-width':1}));
  const allv=TR.layers[l].add1[i].concat(TR.layers[l].X1[i]);
  const rng=Math.max(...allv.map(Math.abs))*1.15;
  const xOf=v=>nlW/2+(v/rng)*(nlW/2-30);
  nl.appendChild(sv('line',{x1:nlW/2,y1:axisY-16,x2:nlW/2,y2:axisY+16,stroke:'rgba(150,170,210,.35)','stroke-width':1,'stroke-dasharray':'3 3'}));
  const zl=sv('text',{x:nlW/2,y:axisY+30,'text-anchor':'middle','font-size':10,fill:'#5b6883','font-family':'var(--mono)'});zl.textContent='0';nl.appendChild(zl);
  const stateLab=sv('text',{x:20,y:14,'font-size':11,fill:'#93a0b8','font-family':'var(--mono)'});stateLab.textContent='the 4 components of “sum”';nl.appendChild(stateLab);
  const dimCols=['#5ea0ff','#54d6e6','#b98cff','#43e0c0'];
  const dots=[];
  for(let d=0;d<D;d++){
    const v=TR.layers[l].add1[i][d];
    const c=sv('circle',{cx:xOf(v),cy:axisY,r:7,fill:dimCols[d],'fill-opacity':.85});
    const t=sv('text',{x:xOf(v),y:axisY-13,'text-anchor':'middle','font-size':9.5,fill:dimCols[d],'font-family':'var(--mono)'});
    t.textContent='d'+d;
    c.addEventListener('mousemove',e=>showTip(`d${d}: sum = ${fmt(TR.layers[l].add1[i][d],3)}\n→ normalised ${fmt(ln.xhat[d],3)}\n→ ×γ+β = ${fmt(TR.layers[l].X1[i][d],3)}`,e.clientX,e.clientY));
    c.addEventListener('mouseleave',hideTip);
    nl.appendChild(c);nl.appendChild(t);
    dots.push({c,t,d});
  }
  p.appendChild(nl);
  const ex=eqxBox(p);
  const g=MODEL.layers[l].g1,be=MODEL.layers[l].be1;
  const lA=eqLn(ex,`μ = mean = <span class="res">${fmt(ln.mu,3)}</span> &nbsp;&nbsp; σ² = variance = <span class="res">${fmt(ln.va,3)}</span>`);
  const lB=eqLn(ex,`normalise: x̂ = (x − μ) ⁄ √(σ²+ε) &nbsp;→&nbsp; e.g. d0: (${fmt(TR.layers[l].add1[i][0],2)} − ${fmt(ln.mu,2)}) ⁄ ${fmt(1/ln.inv,2)} = <span class="res">${fmt(ln.xhat[0],2)}</span>`);
  const lC=eqLn(ex,`re-dress: γ·x̂ + β &nbsp;→&nbsp; d0: ${fmt(g[0],2)} × ${fmt(ln.xhat[0],2)} + ${fmt(be[0],2)} = <span class="resg">${fmt(TR.layers[l].X1[i][0],2)}</span> &nbsp;<span class="eqnote">γ, β are learned — the layer chooses its own preferred scale.</span>`);
  function walk(){
    resetEqx(ex);
    vSum._cells.forEach(c=>c.classList.add('pre'));vOut._cells.forEach(c=>c.classList.add('pre'));
    dots.forEach(({c,t,d})=>{const v=TR.layers[l].add1[i][d];c.setAttribute('cx',xOf(v));t.setAttribute('x',xOf(v));});
    stateLab.textContent='the 4 components of “sum”';
    const s=seq();
    for(let d=0;d<D;d++)s.step(220,()=>{vSum._cells[d].classList.remove('pre');flashVec(vSum,[d]);});
    lineIn(s,lA,500);
    s.step(700,()=>{
      stateLab.textContent='− μ, ÷ √σ²  →  recentred on 0, spread ≈ 1';
      dots.forEach(({c,t,d})=>{
        const v0=TR.layers[l].add1[i][d],v1=ln.xhat[d];
        tween(800,p2=>{const v=v0+(v1-v0)*p2;c.setAttribute('cx',xOf(v));t.setAttribute('x',xOf(v));});
      });
    });
    lineIn(s.wait(600),lB,400);
    s.step(700,()=>{
      stateLab.textContent='× γ + β  →  the layer’s own preferred scale';
      dots.forEach(({c,t,d})=>{
        const v0=ln.xhat[d],v1=TR.layers[l].X1[i][d];
        tween(800,p2=>{const v=v0+(v1-v0)*p2;c.setAttribute('cx',xOf(v));t.setAttribute('x',xOf(v));});
      });
    });
    lineIn(s.wait(500),lC,300);
    for(let d=0;d<D;d++)s.step(180,()=>{vOut._cells[d].classList.remove('pre');flashVec(vOut,[d],'flashg');});
  }
  h.appendChild(p);
  walk();
}});

/* ============ 12 · FFN ============ */
S('Residual & MLP',{map:4,title:'Feed-forward: think it over',render(h){
  const l=STATE.layer,i=STATE.query;
  stageHead(h,{n:12,eyebrow:'Feed-forward network',title:'Each token thinks it over, alone',
    lede:'Attention moved information <i>between</i> tokens. Now a small 2-layer MLP processes each token privately: expand '+D+'→'+DFF+' dims, fire ReLU, compress back '+DFF+'→'+D+'.'});
  if(STATE.intuition)h.appendChild(intu('<b>Analogy:</b> attention was the group discussion; the feed-forward net is each token going away to think about what it just heard. The wide middle gives room to compute richer features — ReLU keeps only the ones that “fire”.'));
  h.appendChild(queryOnlyControl());
  const p=panel(`The network, firing — token “${disp(VOCAB[STATE.tokens[i]])}”`,'Orange edges push positive, blue push negative; edge thickness = contribution. Hover any node or edge for its arithmetic.',()=>renderStage());
  const wrap=el('div',{class:'scrollx'});
  wrap.appendChild(renderFFNNet(l,i,true));
  p.appendChild(wrap);
  const eq=mathEq(p);eq.innerHTML=`FFN(x) = ReLU(x W<span class="sc">1</span> + b<span class="sc">1</span>) W<span class="sc">2</span> + b<span class="sc">2</span>`;
  h.appendChild(p);
  const zeros=TR.layers[l].h1[i].filter(v=>v<0).length;
  const q=panel('The same thing, as vectors','expand → ReLU chops negatives to 0 → project back.');
  const fr=el('div',{class:'flowrow'});
  fr.appendChild(mtxBlock('x₁',`${D}`,renderColVec(TR.layers[l].X1[i],{cw:38})));
  fr.appendChild(op('W₁ ↑'));
  fr.appendChild(mtxBlock('hidden',`${DFF}`,renderColVec(TR.layers[l].h1[i],{cw:34,ch:20})));
  fr.appendChild(op('ReLU'));
  fr.appendChild(mtxBlock('fired',`${DFF}`,renderColVec(TR.layers[l].a[i],{cw:34,ch:20})));
  fr.appendChild(op('W₂ ↓'));
  fr.appendChild(mtxBlock('<span class="cV">FFN out</span>',`${D}`,renderColVec(TR.layers[l].ffn[i],{cw:38})));
  q.appendChild(fr);
  q.appendChild(note('green',`<b>ReLU in action:</b> ${zeros} of ${DFF} hidden units came out negative and were zeroed — only the units that fired pass through. This tiny non-linearity is what lets the network compute things no single matrix ever could.`));
  h.appendChild(q);
}});

/* ============ 13 · Add & Norm 2 ============ */

}});

/* ============ 14 · Depth ============ */

  stageHead(h,{n:14,eyebrow:'Stacking',title:'Repeat, and representations get richer',

  const labs=tokLabels(STATE.tokens);

  p.appendChild(headOnlyControl());

  for(let l=0;l<NL;l++){cmp.appendChild(mtxBlock(`layer ${l+1} · <span style="color:${HEADC[STATE.head]}">head ${STATE.head}</span>`,'',
    renderMatrix({data:TR.layers[l].heads[STATE.head].A,cw:32,ch:24,mode:'seq',maskUpper:true,ylabels:labs,xlabels:labs,

  p.appendChild(cmp);

  /* how much did each token move per layer */
  const q=panel('How hard did each layer edit each token?','L2 distance between a token’s vector entering and leaving the layer — big bar = the layer had a lot to say about that token.');

    STATE.tokens.forEach((id,i)=>{
      items.push({label:`L${l+1} ${disp(VOCAB[id])}`,val:LA.l2(TR.layers[l].X2[i],TR.layers[l].Xin[i]),
        fillStyle:l===0?'linear-gradient(90deg,var(--blue),var(--cyan))':'linear-gradient(90deg,var(--violet),#8a6ae0)'});
    });
  }
  q.appendChild(renderBars(items,{dec:2}));
  h.appendChild(q);
  const r=panel('The last token’s vector, at three checkpoints','This is the slot that will make the prediction. Watch it get rewritten into something the output layer can read.');
  const i=TR.T-1;
  const fr=el('div',{class:'flowrow'});
  fr.appendChild(mtxBlock('after embed',`${D}`,renderColVec(TR.X0[i],{cw:42})));fr.appendChild(arrow());
  fr.appendChild(mtxBlock('after layer 1',`${D}`,renderColVec(TR.layers[0].X2[i],{cw:42})));fr.appendChild(arrow());
  fr.appendChild(mtxBlock('after layer 2',`${D}`,renderColVec(TR.layers[NL-1].X2[i],{cw:42})));

/* ============ 15 · Unembed ============ */
S('Output',{map:6,title:'Back to words',render(h){
  stageHead(h,{n:15,eyebrow:'Unembedding',title:'From a vector back to word scores',
    lede:'Only the <i>last</i> token’s final vector matters for predicting the next word. Compare it against every word’s embedding — one dot product per vocabulary entry — and you get a raw score (“logit”) per candidate.'});
  if(STATE.intuition)h.appendChild(intu('<b>Weight tying:</b> the same matrix E that looked words <i>up</i> at the start is reused, transposed, to read the answer back <i>out</i>. A word scores high exactly when the final vector points in that word’s direction.'));
  const i=TR.T-1;
  const logits=TR.logits[i];
  const order=logits.map((v,k)=>k).sort((a,b)=>logits[b]-logits[a]);
  const top=order[0];
  const p=panel(`x_final · Eᵀ — the logit race`,'One bar per vocabulary word, racing to its score. Green = leader; blue bars are negative (pointing away).',()=>walk());
  const eq=mathEq(p);eq.innerHTML=`logits = x<span class="sc">final</span> · Eᵀ &nbsp;&nbsp;&nbsp; <span class="eqnote">(${D}) · (${D}×${VOCAB.length}) → (${VOCAB.length})</span>`;
  const fr=el('div',{class:'flowrow'});fr.style.alignItems='flex-start';
  const xv=renderColVec(TR.Xfinal[i],{cw:44,label:`x_final — “${disp(VOCAB[STATE.tokens[i]])}”`});
  fr.appendChild(mtxBlock('','',xv));
  fr.appendChild(op('· Eᵀ'));
  const bars=renderBars([],{});bars.style.width='330px';
  fr.appendChild(mtxBlock('logits',`${VOCAB.length}`,bars));
  p.appendChild(fr);
  const mxA=Math.max(...logits.map(Math.abs));
  function fills(k,rank){return rank===0?'linear-gradient(90deg,var(--green),var(--teal))':(logits[k]>=0?'linear-gradient(90deg,var(--orange),var(--amber))':'linear-gradient(90deg,var(--blue-2),var(--blue))');}
  const ex=eqxBox(p);
  const eR=MODEL.E[top];
  const terms=TR.Xfinal[i].map((xv2,d)=>`<span class="t">${d?' + ':''}(${fmt(xv2,2)})(${fmt(eR[d],2)})</span>`).join('');
  const lA=eqLn(ex,`e.g. the winner, “${disp(VOCAB[top])}”: &nbsp; logit = x·E[${disp(VOCAB[top])}] = ${terms} <span class="t">= <span class="resg">${fmt(logits[top],1)}</span></span>`);
  function walk(){
    resetEqx(ex);
    bars._update(order.map((k,rank)=>({label:disp(VOCAB[k]),val:0.001,fillStyle:fills(k,rank)})),{max:mxA,dec:1});
    const s=seq();
    s.step(350,()=>{
      bars._update(order.map((k,rank)=>({label:disp(VOCAB[k]),val:Math.abs(logits[k]),top:rank===0,fillStyle:fills(k,rank)})),{max:mxA,dec:1,minPct:1.5});
      Object.keys(bars._rows).forEach(lab=>{const k=VOCAB.findIndex(w=>disp(w)===lab);if(k>=0)bars._rows[lab].val.textContent=fmt(logits[k],1);});
    });
    lineIn(s.wait(700),lA,300);
    revealTerms(lA,s,330,(k)=>{if(k<D)flashVec(xv,[k]);});
  }
  h.appendChild(p);
  walk();
}});

/* ============ 16 · Softmax + temperature ============ */
S('Output',{map:7,title:'The prediction',render(h){
  stageHead(h,{n:16,eyebrow:'Softmax → probabilities',title:'The prediction',
    lede:'One last softmax turns logits into probabilities over the whole vocabulary. Temperature re-scales the logits first — it is the knob between confident and creative.'});
  const i=TR.T-1;const logits=TR.logits[i];
  const p=panel('Next-word distribution','Drag the temperature — the bars re-shape live, no re-computation tricks: p = softmax(logits ⁄ T).');
  const ctl=el('div',{style:'display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap'});
  ctl.appendChild(el('span',{class:'pick'},'temperature'));
  const sl=el('input',{type:'range',min:'0.2',max:'2',step:'0.1',class:'slider',style:'width:180px'});sl.value=STATE.temp;
  const tv=el('span',{class:'tok-pill'},'T = '+STATE.temp.toFixed(1));
  ctl.appendChild(sl);ctl.appendChild(tv);
  ctl.appendChild(el('span',{class:'eqnote'},'low T → sharp & confident · high T → flat & adventurous'));
  p.appendChild(ctl);
  const bars=renderBars([],{pct:true,max:1});
  p.appendChild(bars);
  const ent=el('div',{class:'eqnote',style:'margin-top:10px;font-family:var(--mono)'},'');
  p.appendChild(ent);
  function refresh(){
    const T=STATE.temp;
    const probs=LA.softmaxRow(logits.map(v=>v/T));
    const order=probs.map((v,k)=>k).sort((a,b)=>probs[b]-probs[a]);
    bars._update(order.slice(0,8).map((k,rank)=>({label:disp(VOCAB[k]),val:probs[k],top:rank===0})),{pct:true,max:1});
    const Hent=-probs.reduce((a,b)=>a+(b>0?b*Math.log2(b):0),0);
    ent.textContent=`entropy = ${Hent.toFixed(3)} bits — ${Hent<0.3?'the model is essentially certain':Hent<1.5?'a few candidates in play':'genuinely unsure'}`;
    return order;
  }
  let order=refresh();
  sl.addEventListener('input',()=>{STATE.temp=parseFloat(sl.value);tv.textContent='T = '+STATE.temp.toFixed(1);order=refresh();});
  h.appendChild(p);
  const q=panel('Result');
  const line=el('div',{style:'display:flex;align-items:center;gap:14px;flex-wrap:wrap'});
  line.appendChild(el('div',{style:'font-family:var(--serif);font-size:18px'},STATE.tokens.map(id=>`<span class="tok-pill">${disp(VOCAB[id])}</span>`).join(' ')));
  line.appendChild(el('span',{class:'arrow'},'→'));
  const predEl=el('div',{class:'bigpred'},disp(VOCAB[STATE.sampleTok!=null?STATE.sampleTok:order[0]]));
  line.appendChild(predEl);
  q.appendChild(line);
  const btns=el('div',{style:'display:flex;gap:10px;margin-top:14px;flex-wrap:wrap'});
  const samp=el('button',{class:'btn'},'🎲 Sample from distribution');
  samp.addEventListener('click',()=>{
    const T=STATE.temp;const probs=LA.softmaxRow(logits.map(v=>v/T));
    const ord=probs.map((v,k)=>k).sort((a,b)=>probs[b]-probs[a]);
    let r=Math.random(),acc=0,pick=ord[0];
    for(const k of ord){acc+=probs[k];if(r<=acc){pick=k;break;}}
    STATE.sampleTok=pick;predEl.textContent=disp(VOCAB[pick]);
    predEl.style.animation='none';void predEl.offsetWidth;predEl.style.animation='popin .5s';
  });
  btns.appendChild(samp);
  const app=el('button',{class:'btn primary'},'＋ Append & continue');
  app.addEventListener('click',()=>{const pick=STATE.sampleTok!=null?STATE.sampleTok:order[0];if(STATE.tokens.length<M.maxlen){STATE.tokens.push(pick);STATE.sampleTok=null;recompute();renderInput();renderStage();}});
  btns.appendChild(app);
  const play=el('button',{class:'btn go'},'✍ Or watch it write the whole thing →');
  play.addEventListener('click',()=>goStage(17));
  btns.appendChild(play);
  q.appendChild(btns);
  h.appendChild(q);
}});

/* ============ 17 · Generation playground ============ */
S('Playground',{map:8,title:'Watch it write ✍',render(h){
  stageHead(h,{n:17,eyebrow:'Generation playground',title:'Watch the model write, one token at a time',
    lede:'The full loop, live: forward pass → attention reaches backward → probabilities → pick → append → repeat, until ⟨eos⟩. Every step below is the real model deciding.'});
  const a=STATE.arc;
  if(STATE.genLog===undefined)STATE.genLog=[];
  const T=TR.T;
  const finished=STATE.tokens[T-1]===stoi['<eos>']||T>=M.maxlen;
  /* controls */
  const p=panel(null,null);
  const ctl=el('div',{class:'genctl'});
  const bWrite=el('button',{class:'btn go'},STATE.genAuto?'⏸ Pause':'▶ Write');
  const bStep=el('button',{class:'btn'},'⏭ Step');
  const bReset=el('button',{class:'btn'},'⟲ Reset');
  ctl.appendChild(bWrite);ctl.appendChild(bStep);ctl.appendChild(bReset);
  const tpick=el('span',{class:'pick'});tpick.appendChild(el('span',{},'T'));
  const sl=el('input',{type:'range',min:'0.2',max:'2',step:'0.1',class:'slider',style:'width:110px'});sl.value=STATE.temp;
  const tv=el('span',{class:'tok-pill'},STATE.temp.toFixed(1));
  sl.addEventListener('input',()=>{STATE.temp=parseFloat(sl.value);tv.textContent=STATE.temp.toFixed(1);});
  tpick.appendChild(sl);tpick.appendChild(tv);ctl.appendChild(tpick);
  const modeSeg=el('div',{class:'seg mini'});
  [['greedy','greedy'],['sample','🎲 sample']].forEach(([v,txt])=>{
    const b=el('button',v===(STATE.genMode||'greedy')?{class:'on'}:{},txt);
    b.addEventListener('click',()=>{STATE.genMode=v;modeSeg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');});
    modeSeg.appendChild(b);
  });
  ctl.appendChild(modeSeg);
  const spSeg=el('div',{class:'seg mini'});
  [[0.6,'slow'],[1,'1×'],[2,'fast']].forEach(([v,txt])=>{
    const b=el('button',v===(STATE.genSpeed||1)?{class:'on'}:{},txt);
    b.addEventListener('click',()=>{STATE.genSpeed=v;spSeg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');});
    spSeg.appendChild(b);
  });
  ctl.appendChild(spSeg);
  p.appendChild(ctl);
  /* sentence */
  const sent=el('div',{class:'gensent'});
  const base=STATE.genSnapshot?STATE.genSnapshot.length:T;
  STATE.tokens.forEach((id,i)=>{
    const w=VOCAB[id];
    const cls='gtok'+(w==='<bos>'?' bos':'')+(w==='<eos>'?' eos':'')+(i>=base?(i===T-1&&STATE.genJustAdded?' new':' gen'):'');
    const g=el('div',{class:cls},disp(w));
    if(i>=base&&!(i===T-1&&STATE.genJustAdded)){g.style.borderColor='rgba(104,230,160,.4)';g.style.color='var(--green)';}
    sent.appendChild(g);
  });
  if(!finished)sent.appendChild(el('div',{class:'gcursor'}));
  p.appendChild(sent);
  /* arcs */
  const cap=el('div',{class:'cap',style:'margin-top:16px'},'where the deciding token is looking (layer '+(a.layer+1)+', '+(a.head==='both'?'both heads':'head '+a.head)+'):');
  p.appendChild(cap);
  const arcs=renderArcs({layer:a.layer,head:a.head,query:T-1,height:150,minW:.03,interactive:true});
  p.appendChild(arcs.el);
  /* probs */
  const probs=LA.softmaxRow(TR.logits[T-1].map(v=>v/STATE.temp));
  const order=probs.map((v,k)=>k).sort((a2,b)=>probs[b]-probs[a2]);
  const bars=renderBars([],{pct:true,max:1});
  bars.style.maxWidth='420px';bars.style.marginTop='14px';
  p.appendChild(bars);
  const showBars=()=>{
    const pr=LA.softmaxRow(TR.logits[T-1].map(v=>v/STATE.temp));
    const od=pr.map((v,k)=>k).sort((x,y)=>pr[y]-pr[x]);
    bars._update(od.slice(0,6).map((k,rank)=>({label:disp(VOCAB[k]),val:pr[k],top:rank===0})),{pct:true,max:1});
    return {pr,od};
  };
  /* log */
  const logBox=el('div',{class:'genlog'});
  STATE.genLog.forEach(o=>logBox.appendChild(el('span',{class:'g'},`${o.i}. <b>${o.w}</b> ${o.p}%${o.m==='sample'?' 🎲':''}`)));
  p.appendChild(logBox);
  h.appendChild(p);
  if(finished){bars.style.display='none';cap.style.display='none';}else showBars();
  /* done panel */
  if(finished){
    const done=panel('Done ✓');
    const words=STATE.tokens.filter(id=>VOCAB[id]!=='<bos>'&&VOCAB[id]!=='<eos>').map(id=>VOCAB[id]).join(' ');
    done.appendChild(el('div',{style:'font-family:var(--serif);font-size:24px;color:var(--green);text-shadow:0 0 18px rgba(104,230,160,.35)'},'“'+words+'”'));
    done.appendChild(el('div',{class:'eqnote',style:'margin-top:8px'},(STATE.genLog.length?'It wrote '+STATE.genLog.length+' token'+(STATE.genLog.length>1?'s':'')+' on its own — each one chosen by the full pipeline you just walked through.':'This sentence is already complete (ends in ⟨eos⟩ or hit the '+M.maxlen+'-position limit). Reset or pick a shorter start below.')));
    h.appendChild(done);
    STATE.genAuto=false;
    bWrite.textContent='▶ Write';
  }
  /* quick starts */
  const qs=panel('Quick starts','Give it less to go on — watch it finish the thought. (The model was trained on 8 sentences of the pattern det · adj · noun · verb · “on the” · place.)');
  const qrow=el('div',{style:'display:flex;gap:10px;flex-wrap:wrap'});
  [['the big dog',['<bos>','the','big','dog']],
   ['a small cat',['<bos>','a','small','cat']],
   ['the small dog ran',['<bos>','the','small','dog','ran']],
   ['just ⟨bos⟩ — free run',['<bos>']]].forEach(([lb,ws])=>{
    const b=el('button',{class:'btn'},lb);
    b.addEventListener('click',()=>{STATE.tokens=ws.map(w=>stoi[w]);STATE.genSnapshot=STATE.tokens.slice();STATE.genLog=[];STATE.genJustAdded=false;STATE.genAuto=false;recompute();renderInput();renderStage();});
    qrow.appendChild(b);
  });
  qs.appendChild(qrow);
  h.appendChild(qs);
  /* mechanics */
  const spd=ms=>ms/(STATE.genSpeed||1);
  function stepOnce(auto){
    if(STATE.tokens[TR.T-1]===stoi['<eos>']||TR.T>=M.maxlen){STATE.genAuto=false;renderStage();return;}
    if(!STATE.genSnapshot)STATE.genSnapshot=STATE.tokens.slice();
    const s=seq();
    s.at(spd(150),()=>arcs.flow());
    s.at(spd(800),()=>showBars());
    s.at(spd(1650),()=>{
      const {pr,od}=showBars();
      let pick=od[0];
      if((STATE.genMode||'greedy')==='sample'){let r=Math.random(),acc=0;for(const k of od){acc+=pr[k];if(r<=acc){pick=k;break;}}}
      STATE.genLog.push({i:STATE.genLog.length+1,w:disp(VOCAB[pick]),p:(100*pr[pick]).toFixed(0),m:STATE.genMode||'greedy'});
      STATE.tokens.push(pick);
      STATE.genJustAdded=true;
      recompute();renderInput();renderStage();
    });
  }
  bStep.addEventListener('click',()=>{STATE.genAuto=false;stepOnce(false);});
  bWrite.addEventListener('click',()=>{
    if(STATE.genAuto){STATE.genAuto=false;bWrite.textContent='▶ Write';killSeqs();return;}
    STATE.genAuto=true;bWrite.textContent='⏸ Pause';stepOnce(true);
  });
  bReset.addEventListener('click',()=>{
    if(STATE.genSnapshot){STATE.tokens=STATE.genSnapshot.slice();}
    STATE.genLog=[];STATE.genAuto=false;STATE.genJustAdded=false;
    recompute();renderInput();renderStage();
  });
  /* if we arrived mid-auto-run, continue */
  if(STATE.genAuto&&!finished){
    seq().at(spd(650),()=>stepOnce(true));
  }
  STATE.genJustAdded=false;
}});

/* ============ 18 · Recap ============ */
S('Recap',{map:-1,title:'You just ran a transformer',render(h){
  stageHead(h,{n:18,eyebrow:'The whole journey',title:'You just ran a transformer, end to end',
    lede:'Every number came from one tiny real model. Here’s the whole path, and the one idea that ties it together.'});
  const p=panel('The residual stream, start to finish');
  const steps=[['Tokenize','text → IDs',1],['Embed + Position','IDs → '+D+'-dim vectors with order baked in',2],
    ['Attention ×'+NL,'tokens exchange information — Q·K → mask → softmax → mix V',4],
    ['Feed-Forward ×'+NL,'each token computes privately — expand → ReLU → shrink',12],
    ['Add & Norm','every edit is added to the stream, then normalised',11],
    ['Unembed + Softmax','final vector → probabilities over the vocabulary',15]];
  const list=el('div',{style:'display:flex;flex-direction:column;gap:10px'});
  steps.forEach((s,i)=>{
    const r=el('div',{style:'display:flex;gap:12px;align-items:baseline;cursor:pointer;border-radius:8px;padding:4px 6px;transition:.15s'});
    r.addEventListener('mouseenter',()=>r.style.background='rgba(255,255,255,.04)');
    r.addEventListener('mouseleave',()=>r.style.background='');
    r.addEventListener('click',()=>goStage(s[2]));
    r.appendChild(el('div',{style:'font-family:var(--mono);color:var(--blue);width:22px'},String(i+1)));
    r.appendChild(el('div',{},`<b>${s[0]}</b> &nbsp;<span style="color:var(--muted)">${s[1]}</span>`));
    list.appendChild(r);
  });
  p.appendChild(list);h.appendChild(p);
  h.appendChild(note('green','<b>The one big idea:</b> a transformer is a stack of <i>edits</i> to a set of vectors. Attention decides <b>which tokens share information</b>; the feed-forward net decides <b>what to compute with it</b>; residual connections keep everything flowing. Stack it, scale it, and simple parts compose into language.'));
  const q=panel('Keep exploring');
  q.appendChild(el('div',{class:'lede',style:'margin:0'},'Change the sentence in the top bar. Break it — feed it “cat cat cat on”. Switch heads on stage 8 and watch the wiring change. Crank the temperature on stage 16. Everything recomputes instantly, and truthfully.'));
  const b=el('div',{style:'display:flex;gap:10px;margin-top:14px;flex-wrap:wrap'});
  const a1=el('button',{class:'btn'},'✨ Attention theater');a1.addEventListener('click',()=>goStage(8));
  const a2=el('button',{class:'btn go'},'✍ Generation playground');a2.addEventListener('click',()=>goStage(17));
  const a3=el('button',{class:'btn'},'↥ Start over');a3.addEventListener('click',()=>goStage(0));
  b.appendChild(a1);b.appendChild(a2);b.appendChild(a3);q.appendChild(b);
  h.appendChild(q);
}});

/* ---------------- shared controls ---------------- */
function headQueryControls(){
  const w=el('div',{style:'display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:2px 0 4px'});
  const lw=el('div',{class:'pick'});lw.appendChild(el('span',{},'layer'));
  const ls=el('div',{class:'seg'});
  for(let l=0;l<NL;l++){const b=el('button',l===STATE.layer?{class:'on'}:{},'L'+(l+1));b.addEventListener('click',()=>{STATE.layer=l;renderStage();});ls.appendChild(b);}
  lw.appendChild(ls);w.appendChild(lw);
  const hw=el('div',{class:'pick'});hw.appendChild(el('span',{},'head'));
  const hs=el('div',{class:'seg'});
  for(let hh=0;hh<H;hh++){const b=el('button',hh===STATE.head?{class:'on'}:{},'head '+hh);
    b.style.color=hh===STATE.head?'':HEADC[hh];
    b.addEventListener('click',()=>{STATE.head=hh;renderStage();});hs.appendChild(b);}
  hw.appendChild(hs);w.appendChild(hw);
  const qw=el('div',{class:'pick'});qw.appendChild(el('span',{},'query token'));
  const sel=el('select');STATE.tokens.forEach((id,i)=>{const o=el('option',{value:i},`${i}: ${disp(VOCAB[id])}`);if(i===STATE.query)o.selected=true;sel.appendChild(o);});
  sel.addEventListener('change',()=>{STATE.query=parseInt(sel.value);renderStage();});
  qw.appendChild(sel);w.appendChild(qw);
  return w;
}
function queryOnlyControl(){
  const w=el('div',{style:'display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:2px 0 4px'});
  const lw=el('div',{class:'pick'});lw.appendChild(el('span',{},'layer'));
  const ls=el('div',{class:'seg'});
  for(let l=0;l<NL;l++){const b=el('button',l===STATE.layer?{class:'on'}:{},'L'+(l+1));b.addEventListener('click',()=>{STATE.layer=l;renderStage();});ls.appendChild(b);}
  lw.appendChild(ls);w.appendChild(lw);
  const qw=el('div',{class:'pick'});qw.appendChild(el('span',{},'token'));
  const sel=el('select');STATE.tokens.forEach((id,i)=>{const o=el('option',{value:i},`${i}: ${disp(VOCAB[id])}`);if(i===STATE.query)o.selected=true;sel.appendChild(o);});
  sel.addEventListener('change',()=>{STATE.query=parseInt(sel.value);renderStage();});
  qw.appendChild(sel);w.appendChild(qw);
  return w;
}
function headOnlyControl(){
  const w=el('div',{style:'margin-top:4px'});const hw=el('div',{class:'pick'});hw.appendChild(el('span',{},'head'));
  const hs=el('div',{class:'seg'});for(let hh=0;hh<H;hh++){const b=el('button',hh===STATE.head?{class:'on'}:{},'head '+hh);
    b.style.color=hh===STATE.head?'':HEADC[hh];
    b.addEventListener('click',()=>{STATE.head=hh;renderStage();});hs.appendChild(b);}
  hw.appendChild(hs);w.appendChild(hw);return w;
}
function maybeLookbackNote(host,l,hh){
  const qi=STATE.query;
  const hd=TR.layers[l].heads[hh];
  if(!hd) return false;
  let tk=0;for(let j=0;j<=qi;j++)if(hd.A[qi][j]>hd.A[qi][tk])tk=j;
  const kw=VOCAB[STATE.tokens[tk]];
  const nouns=MODEL.grammar.nouns, verbs=Object.values(MODEL.grammar.noun_verb);
  if(tk<qi-1 && (nouns.includes(kw)||verbs.includes(kw))){
    host.appendChild(note('green',`<b>Look-back spotted:</b> the query “${disp(VOCAB[STATE.tokens[qi]])}” (position ${qi}) sends most of head ${hh}’s attention <i>backward</i> to “${disp(kw)}” (position ${tk}) — reaching past its neighbours to the ${nouns.includes(kw)?'subject':'verb'}. That is how subject information travels forward to shape the prediction.`));
    return true;
  }
  return false;
}

/* ---------------- input bar ---------------- */
function renderInput(){
  const bar=document.getElementById('chips');clear(bar);
  STATE.tokens.forEach((id,i)=>{
    if(i===0){const b=el('div',{class:'chip sp'});b.style.borderColor='var(--line2)';b.innerHTML=`⟨bos⟩ <span class="pos">0</span>`;bar.appendChild(b);return;}
    const c=el('div',{class:'chip'});c.style.setProperty('--c',tokColor(i));
    c.innerHTML=`${disp(VOCAB[id])} <span class="pos">${i}</span> <span class="x">✕</span>`;
    c.addEventListener('click',()=>{STATE.tokens.splice(i,1);STATE.sampleTok=null;STATE.genSnapshot=null;STATE.genLog=[];recompute();renderInput();renderStage();});
    bar.appendChild(c);
  });
  if(STATE.tokens.length<M.maxlen){
    const aw=el('div',{class:'addwrap'});
    const add=el('button',{class:'add'},'＋ token');
    const pop=el('div',{class:'vocabpop'});
    VOCAB.forEach((w,k)=>{if(w==='<bos>')return;const b=el('button',{},disp(w));b.addEventListener('click',()=>{STATE.tokens.push(k);STATE.sampleTok=null;STATE.genSnapshot=null;STATE.genLog=[];pop.classList.remove('open');recompute();renderInput();renderStage();});pop.appendChild(b);});
    add.addEventListener('click',e=>{e.stopPropagation();pop.classList.toggle('open');});
    document.addEventListener('click',()=>pop.classList.remove('open'));
    aw.appendChild(add);aw.appendChild(pop);bar.appendChild(aw);
  }
}

/* ---------------- rail ---------------- */
function renderRail(){
  const rail=document.getElementById('rail');clear(rail);
  let curGroup=null;
  STAGES.forEach((s,i)=>{
    if(s.group!==curGroup){curGroup=s.group;rail.appendChild(el('div',{class:'grp'},s.group));}
    const a=el('a',{});a.className=(i===STATE.stage?'on':'')+(i<STATE.stage?' done':'');
    a.appendChild(el('span',{class:'dot'}));a.appendChild(el('span',{},s.title));
    a.addEventListener('click',()=>goStage(i));
    rail.appendChild(a);
  });
}

/* ---------------- controller ---------------- */
const stageEl=()=>document.getElementById('stage');
let PREVSTAGE=0;
function renderStage(){
  killSeqs();
  const host=el('div',{class:'stage'});
  STAGES[STATE.stage].render(host);
  const s=stageEl();clear(s);s.appendChild(host);
  const nav=el('div',{class:'nav'});
  const prev=el('button',{class:'btn'},'← Prev');prev.disabled=STATE.stage===0;prev.addEventListener('click',()=>goStage(STATE.stage-1));
  const next=el('button',{class:'btn primary'},STATE.stage===STAGES.length-1?'Restart ↥':'Next →');
  next.addEventListener('click',()=>goStage(STATE.stage===STAGES.length-1?0:STATE.stage+1));
  nav.appendChild(prev);nav.appendChild(next);
  nav.appendChild(el('div',{class:'prog'},`${STATE.stage+1} / ${STAGES.length}`));
  host.appendChild(nav);
  document.body.classList.toggle('intuition-off',!STATE.intuition);
  document.body.classList.toggle('math-off',!STATE.math);
  renderRail();
  updateMap(PREVSTAGE,STATE.stage);
  PREVSTAGE=STATE.stage;
}
function goStage(i){STATE.stage=Math.max(0,Math.min(STAGES.length-1,i));window.scrollTo({top:0,behavior:MOTION.on?'smooth':'auto'});renderStage();}

/* ---------------- global controls + boot ---------------- */
function initControls(){
  document.querySelectorAll('#detailseg button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#detailseg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    const m=b.dataset.m;STATE.intuition=(m==='both'||m==='intu');STATE.math=(m==='both'||m==='math');renderStage();
  }));
  document.querySelectorAll('#motionseg button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#motionseg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    MOTION.on=b.dataset.m==='on';renderStage();
  }));
  if(!MOTION.on){
    document.querySelectorAll('#motionseg button').forEach(x=>x.classList.toggle('on',x.dataset.m==='off'));
  }
  const ps=document.getElementById('preset');
  const PRE={
    'cat-place':['<bos>','the','big','cat','sat','on','the'],
    'dog-place':['<bos>','a','small','dog','ran','on','the'],
    'verb':['<bos>','the','big','dog'],
    'full':['<bos>','the','small','cat','sat','on','the','mat'],
  };
  ps.addEventListener('change',()=>{const p=PRE[ps.value];if(p){STATE.tokens=p.map(w=>stoi[w]);STATE.sampleTok=null;STATE.genSnapshot=null;STATE.genLog=[];STATE.genAuto=false;recompute();renderInput();renderStage();}});
  document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')goStage(STATE.stage+1);if(e.key==='ArrowLeft')goStage(STATE.stage-1);});
  let lastW=innerWidth,rt=null;
  window.addEventListener('resize',()=>{
    if(Math.abs(innerWidth-lastW)<40)return;
    clearTimeout(rt);rt=setTimeout(()=>{lastW=innerWidth;renderStage();},350);
  });
}

/* ---------------- boot ---------------- */
recompute();
verifyModel();
buildMap();
renderInput();
initControls();
renderStage();
</script>
